# ================================================================
#  UC-Centralized Campus Load Balancer Configuration
#  Tailored for High-Concurrency Deployment across UC Main Campus
# ================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance & Network Tweaks
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression for Fast Campus Wi-Fi / Low Bandwidth
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Campus Rate Limiting Zones (Prevents DDoS & Brute-Force on Login)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # -------------------------------------------------------------
    # Upstream Backend Server Cluster (Load Balanced Pool)
    # Supports round-robin, least_conn, or ip_hash for sticky sessions
    # -------------------------------------------------------------
    upstream uc_backend_cluster {
        least_conn; # Routes to worker with fewest active connections

        # Primary backend instances / worker nodes
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s backup;
        
        # High-performance connection pooling
        keepalive 64;
    }

    # Upstream for WebSocket / Socket.IO (IP Hash for sticky sessions)
    upstream uc_socket_cluster {
        ip_hash;
        server 127.0.0.1:5000;
        server 127.0.0.1:5001 backup;
        keepalive 64;
    }

    # -------------------------------------------------------------
    # Main Server Virtual Host
    # -------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name uc-central.uc.edu.ph localhost;

        # Client body limit for file/image uploads (merch, profile, messages)
        client_max_body_size 25M;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # --- Health Check Endpoint for Infrastructure Load Balancers ---
        location /health {
            proxy_pass http://uc_backend_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # --- API Routes Load Balancing ---
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://uc_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }

        # --- Auth Route Rate Limiting (Login & Register Protection) ---
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://uc_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Socket.IO & Realtime WebSocket Load Balancing (Sticky Sessions) ---
        location /socket.io/ {
            proxy_pass http://uc_socket_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Extended timeouts for long-lived WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # --- Frontend Static Files & SPA Routing ---
        location / {
            root /var/www/uc-central/client/dist;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache immutable static assets
            location ~* \.(?:css|js|woff2?|svg|png|jpe?g|gif|ico|webp)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
            }
        }
    }
}
