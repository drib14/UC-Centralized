<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich Institutional Gradients -->
    <linearGradient id="ucNavyDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b7f" />
      <stop offset="50%" stop-color="#001f5c" />
      <stop offset="100%" stop-color="#001238" />
    </linearGradient>

    <linearGradient id="ucGoldRadiant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="25%" stop-color="#FBC02D" />
      <stop offset="65%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="ucGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#FDD835" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>

    <linearGradient id="shieldBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003399" />
      <stop offset="50%" stop-color="#002266" />
      <stop offset="100%" stop-color="#001238" />
    </linearGradient>

    <linearGradient id="torchFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="30%" stop-color="#EA580C" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="bookPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="48%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="52%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="sealDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="torchGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>

    <!-- Mathematical Text Arc Paths (Radius 180 centered at (250,250)) -->
    <!-- Top Arc for UNIVERSITY OF CEBU (Left-to-Right Clockwise) -->
    <path id="topTextArc" d="M 70 250 A 180 180 0 0 1 430 250" fill="none" />
    <!-- Bottom Arc for CEBU CITY, PHILIPPINES • 1964 (Right-to-Left Clockwise for bottom reading) -->
    <path id="bottomTextArc" d="M 430 250 A 180 180 0 0 1 70 250" fill="none" />
  </defs>

  <!-- ================= BACKGROUND & OUTER SEAL BORDERS ================= -->
  <!-- Outer Gold Beaded Ring Shadow -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="url(#ucGoldRadiant)" stroke-width="6" filter="url(#sealDropShadow)" />

  <!-- Outer Deep Navy Blue Enamel Ring -->
  <circle cx="250" cy="250" r="236" fill="url(#ucNavyDeep)" stroke="#FFA000" stroke-width="2" />

  <!-- Decorative Inner Gold Beaded Border -->
  <circle cx="250" cy="250" r="228" fill="none" stroke="url(#ucGoldLight)" stroke-width="2.5" stroke-dasharray="3 4" opacity="0.9" />

  <!-- Middle Gold Divider Ring -->
  <circle cx="250" cy="250" r="168" fill="none" stroke="url(#ucGoldRadiant)" stroke-width="5" />
  <!-- Center Field Background (Navy Blue) -->
  <circle cx="250" cy="250" r="163" fill="#00153D" stroke="#FFA000" stroke-width="1.5" />

  <!-- ================= CIRCULAR TYPOGRAPHY ================= -->
  <!-- Top Arched Text: UNIVERSITY OF CEBU -->
  <text font-family="'Inter', 'Montserrat', 'Arial Black', 'Helvetica Neue', sans-serif"
        font-weight="900" font-size="25.5" fill="url(#ucGoldLight)" letter-spacing="4.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      UNIVERSITY OF CEBU
    </textPath>
  </text>

  <!-- Left & Right Separator 5-Point Stars -->
  <g fill="url(#ucGoldLight)" stroke="#D97706" stroke-width="0.8">
    <!-- Left Star (at ~180 deg) -->
    <polygon points="68,250 71,257 78,257 73,262 75,269 68,264 61,269 63,262 58,257 65,257" />
    <!-- Right Star (at ~0 deg) -->
    <polygon points="432,250 435,257 442,257 437,262 439,269 432,264 425,269 427,262 422,257 429,257" />
  </g>

  <!-- Bottom Arched Text: CEBU CITY, PHILIPPINES • 1964 -->
  <text font-family="'Inter', 'Montserrat', 'Arial', sans-serif"
        font-weight="800" font-size="16.5" fill="#FFFFFF" letter-spacing="3.8">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      CEBU CITY, PHILIPPINES • 1964
    </textPath>
  </text>

  <!-- ================= LAUREL WREATH OF EXCELLENCE ================= -->
  <!-- Left Laurel Branch (Symmetrical Curved Leaf Clusters) -->
  <g fill="url(#ucGoldRadiant)" stroke="#B45309" stroke-width="0.5">
    <path d="M 108 240 C 95 224 100 204 116 200 C 116 214 112 228 108 240 Z" />
    <path d="M 100 270 C 86 256 90 236 106 230 C 108 244 105 258 100 270 Z" />
    <path d="M 104 300 C 90 288 92 268 108 260 C 110 274 109 288 104 300 Z" />
    <path d="M 115 328 C 100 318 101 298 114 290 C 119 303 118 316 115 328 Z" />
    <path d="M 134 354 C 119 346 118 326 128 316 C 136 328 137 342 134 354 Z" />
    <path d="M 160 376 C 146 370 141 352 151 340 C 159 350 163 364 160 376 Z" />
    <path d="M 192 392 C 178 390 171 374 180 360 C 188 370 193 382 192 392 Z" />
  </g>

  <!-- Right Laurel Branch (Symmetrical Curved Leaf Clusters) -->
  <g fill="url(#ucGoldRadiant)" stroke="#B45309" stroke-width="0.5">
    <path d="M 392 240 C 405 224 400 204 384 200 C 384 214 388 228 392 240 Z" />
    <path d="M 400 270 C 414 256 410 236 394 230 C 392 244 395 258 400 270 Z" />
    <path d="M 396 300 C 410 288 408 268 392 260 C 390 274 391 288 396 300 Z" />
    <path d="M 385 328 C 400 318 399 298 386 290 C 381 303 382 316 385 328 Z" />
    <path d="M 366 354 C 381 346 382 326 372 316 C 364 328 363 342 366 354 Z" />
    <path d="M 340 376 C 354 370 359 352 349 340 C 341 350 337 364 340 376 Z" />
    <path d="M 308 392 C 322 390 329 374 320 360 C 312 370 307 382 308 392 Z" />
  </g>

  <!-- Laurel Base Ribbon Tie -->
  <path d="M 235 390 Q 250 382 265 390 Q 250 398 235 390 Z" fill="url(#ucGoldLight)" stroke="#B45309" stroke-width="1" />

  <!-- ================= CENTRAL HERALDIC SHIELD ================= -->
  <g filter="url(#sealDropShadow)">
    <!-- Shield Outer Gold Frame -->
    <path d="M 250 125 Q 332 125 340 195 Q 342 284 250 344 Q 158 284 160 195 Q 168 125 250 125 Z"
          fill="url(#shieldBgGrad)" stroke="url(#ucGoldRadiant)" stroke-width="6.5" stroke-linejoin="round" />

    <!-- Shield Inner Fine Gold Pinstripe -->
    <path d="M 250 135 Q 322 135 330 198 Q 332 274 250 330 Q 168 274 170 198 Q 178 135 250 135 Z"
          fill="none" stroke="#FFA000" stroke-width="1.8" opacity="0.85" />
  </g>

  <!-- Sun Rays in Upper Shield -->
  <g stroke="url(#ucGoldLight)" stroke-width="1.6" opacity="0.4">
    <line x1="250" y1="180" x2="195" y2="152" />
    <line x1="250" y1="180" x2="212" y2="142" />
    <line x1="250" y1="180" x2="232" y2="136" />
    <line x1="250" y1="180" x2="250" y2="134" />
    <line x1="250" y1="180" x2="268" y2="136" />
    <line x1="250" y1="180" x2="288" y2="142" />
    <line x1="250" y1="180" x2="305" y2="152" />
  </g>

  <!-- ================= OPEN BOOK OF KNOWLEDGE ================= -->
  <g filter="url(#sealDropShadow)">
    <!-- Book Leather Binding Cover -->
    <path d="M 250 286 C 226 272 190 274 176 284 L 176 304 C 192 294 228 292 250 304 C 272 292 308 294 324 304 L 324 284 C 310 274 274 272 250 286 Z"
          fill="url(#bookCoverGrad)" stroke="url(#ucGoldRadiant)" stroke-width="1.5" />

    <!-- Book Pages (Open Spread) -->
    <path d="M 250 281 C 226 268 192 270 180 278 L 180 296 C 194 288 228 286 250 298 C 272 286 306 288 320 296 L 320 278 C 308 270 274 268 250 281 Z"
          fill="url(#bookPageGrad)" stroke="#CBD5E1" stroke-width="1.2" />

    <!-- Book Center Spine -->
    <line x1="250" y1="281" x2="250" y2="298" stroke="#94A3B8" stroke-width="1.5" />

    <!-- Page Content Notation Lines (Left Page) -->
    <line x1="190" y1="281" x2="238" y2="277" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    <line x1="190" y1="286" x2="238" y2="282" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    <line x1="192" y1="291" x2="236" y2="287" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />

    <!-- Page Content Notation Lines (Right Page) -->
    <line x1="262" y1="277" x2="310" y2="281" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    <line x1="262" y1="282" x2="310" y2="286" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    <line x1="264" y1="287" x2="308" y2="291" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- ================= THE TORCH OF WISDOM ================= -->
  <g filter="url(#sealDropShadow)">
    <!-- Torch Shaft & Handle (Solid Gold Column) -->
    <path d="M 244 220 L 256 220 L 253 270 L 247 270 Z" fill="url(#ucGoldRadiant)" stroke="#78350F" stroke-width="1.2" />
    <!-- Fluted Torch Cup / Brazier -->
    <path d="M 234 220 C 234 220 231 204 250 204 C 269 204 266 220 266 220 Z" fill="url(#ucGoldRadiant)" stroke="#78350F" stroke-width="1.2" />

    <!-- Grip Ribs on Torch -->
    <rect x="241" y="232" width="18" height="3" rx="1.5" fill="#FFFBEB" stroke="#78350F" stroke-width="0.8" />
    <rect x="243" y="246" width="14" height="2.5" rx="1.2" fill="#FFFBEB" stroke="#78350F" stroke-width="0.8" />

    <!-- Outer Flaming Glow -->
    <path d="M 250 142 C 236 162 226 178 236 198 C 241 187 247 182 252 176 C 257 186 263 190 265 198 C 275 182 270 164 250 142 Z"
          fill="url(#torchFlameGrad)" filter="url(#torchGlow)" />

    <!-- Inner High-Intensity Flame Core (Brilliant Yellow-White) -->
    <path d="M 250 156 C 242 170 236 180 243 192 C 246 185 250 181 253 178 C 256 184 259 187 260 192 C 266 182 262 172 250 156 Z"
          fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- ================= MOTTO BANNER RIBBON (FOUNDED 1964) ================= -->
  <g filter="url(#sealDropShadow)">
    <path d="M 205 328 L 295 328 L 285 342 L 215 342 Z" fill="url(#ucGoldRadiant)" stroke="#78350F" stroke-width="1" />
    <text x="250" y="339" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="10.5" fill="#00153D" text-anchor="middle" letter-spacing="2">
      1964
    </text>
  </g>

  <!-- 3 Stars Accent over Shield -->
  <g fill="url(#ucGoldLight)" stroke="#D97706" stroke-width="0.5">
    <polygon points="250,96 253,105 262,105 255,111 257,120 250,114 243,120 245,111 238,105 247,105" />
    <polygon points="228,104 230,111 237,111 231,116 233,123 228,118 223,123 225,116 219,111 226,111" opacity="0.85" />
    <polygon points="272,104 274,111 281,111 275,116 277,123 272,118 267,123 269,116 263,111 270,111" opacity="0.85" />
  </g>
</svg>
