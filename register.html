<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UC-Central</title>
    <link
      rel="shortcut icon"
      href="assets/uc-central-logo.png"
      type="image/x-icon"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="auth-container w-100" style="max-width: 600px">
        <div class="auth-header">
          <h2>Create Account</h2>
          <p class="text-muted">Join the UC-Central community</p>
        </div>

        <form id="register-form">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" required />
            </div>
            <div class="col-md-6 mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" required />
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" required />
          </div>

          <div class="mb-3">
            <label for="studentId" class="form-label">Student ID</label>
            <input type="text" class="form-control" id="studentId" required />
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="department" class="form-label">Department</label>
              <select class="form-select" id="department" required>
                <option value="CCS">College of Computer Studies (CCS)</option>
                <option value="CBA">College of Business Administration (CBA)</option>
                <option value="CAS">College of Arts and Sciences (CAS)</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="year" class="form-label">Year Level</label>
              <select class="form-select" id="year" required>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="program" class="form-label">Program</label>
            <input
              type="text"
              class="form-control"
              id="program"
              placeholder="e.g. BSIT"
              required
            />
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                required
              />
            </div>
            <div class="col-md-6 mb-3">
              <label for="confirmPassword" class="form-label"
                >Confirm Password</label
              >
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                required
              />
            </div>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Register</button>
          </div>
        </form>

        <div class="mt-3 text-center">
          <p class="small">
            Already have an account?
            <a href="login.html" class="text-success">Login here</a>
          </p>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
      // Handle Register
      document
        .getElementById("register-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (password !== confirmPassword) {
            showToast("Passwords do not match!", "error");
            return;
          }

          const user = {
            studentId: document.getElementById("studentId").value,
            email: document.getElementById("email").value,
            firstName: document.getElementById("firstName").value,
            lastName: document.getElementById("lastName").value,
            department: document.getElementById("department").value,
            program: document.getElementById("program").value,
            year: document.getElementById("year").value,
            password: password,
            role: "student",
          };

          try {
            await Auth.register(user);
            showToast("Registration successful! Please login.", "success");
            setTimeout(() => {
              window.location.href = "login.html";
            }, 1500);
          } catch (error) {
            showToast(error.message, "error");
          }
        });
    </script>
  </body>
</html>
