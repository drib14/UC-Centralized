    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Merchandise Management</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addMerchModal"><i class="fa-solid fa-plus"></i> Add Product</button>
        </div>

        <div class="row" id="merch-list">
            <!-- JS populated -->
        </div>
    </div>

    <!-- Add Merch Modal -->
    <div class="modal fade" id="addMerchModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-merch-form">
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" id="m-name" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price (PHP)</label>
                                <input type="number" id="m-price" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <select id="m-cat" class="form-select">
                                    <option value="Shirt">Shirt</option>
                                    <option value="Hoodie">Hoodie</option>
                                    <option value="Accessories">Accessories</option>
                                    <option value="Uniform">Uniform</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select id="m-dept" class="form-select">
                                <option value="ALL">All Departments</option>
                                <!-- Populated via JS -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="text" id="m-img" class="form-control" placeholder="https://..." value="https://placehold.co/300x300?text=Product">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveMerch()">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.requireAdmin();

        // Populate Dept
        const deptSelect = document.getElementById('m-dept');
        if(window.MockData) { // Fallback/Init check
            window.MockData.departments.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.name;
                deptSelect.appendChild(opt);
            });
        }

        function renderMerch() {
            const list = document.getElementById('merch-list');
            list.innerHTML = '';
            const items = DB.getMerch();

            items.forEach(item => {
                const col = document.createElement('div');
                col.className = 'col-md-3 mb-4';
                col.innerHTML = `
                    <div class="card h-100">
                        <img src="${item.image}" class="card-img-top" style="height: 150px; object-fit: cover;">
                        <div class="card-body">
                            <h6 class="card-title">${item.name}</h6>
                            <div class="d-flex justify-content-between">
                                <span class="text-success fw-bold">${formatCurrency(item.price)}</span>
                                <small class="text-muted">${item.department}</small>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(col);
            });
        }

        function saveMerch() {
            const name = document.getElementById('m-name').value;
            const price = parseFloat(document.getElementById('m-price').value);
            const category = document.getElementById('m-cat').value;
            const dept = document.getElementById('m-dept').value;
            const image = document.getElementById('m-img').value;

            if(!name || !price) {
                showToast('Please fill required fields', 'error');
                return;
            }

            DB.addMerch({ name, price, category, department: dept, image });
            showToast('Product added successfully!', 'success');

            const modalEl = document.getElementById('addMerchModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            // Clear form
            document.getElementById('add-merch-form').reset();
            renderMerch();
        }

        renderMerch();
    </script>
