</head>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Merchandise Management</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addMerchModal"><i class="fa-solid fa-plus"></i> Add Product</button>
        </div>

        <div class="row" id="merch-list">
            <!-- JS populated -->
        </div>
    </div>

    <!-- Add Merch Modal -->
    <div class="modal fade" id="addMerchModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-merch-form">
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" id="m-name" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price (PHP)</label>
                                <input type="number" id="m-price" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category (Description)</label>
                                <select id="m-cat" class="form-select">
                                    <option value="Shirt">Shirt</option>
                                    <option value="Hoodie">Hoodie</option>
                                    <option value="Accessories">Accessories</option>
                                    <option value="Uniform">Uniform</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select id="m-dept" class="form-select">
                                <option value="ALL">All Departments</option>
                                <!-- Populated via JS -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image</label>
                            <input type="file" id="m-image-file" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Detailed Description</label>
                            <textarea id="m-desc" class="form-control" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveMerch()">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this item? This action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        const deptSelect = document.getElementById('m-dept');
        const departments = [
            {id: 'CCS', name: 'College of Computer Studies'},
            {id: 'CBA', name: 'College of Business Administration'},
            {id: 'CAS', name: 'College of Arts and Sciences'},
            {id: 'ALL', name: 'All Departments'}
        ];

        departments.forEach(d => {
            if(d.id !== 'ALL') {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.name;
                deptSelect.appendChild(opt);
            }
        });

        async function fetchMerch() {
            try {
                const items = await API.getMerch();
                renderMerch(items);
            } catch (e) {
                showToast("Failed to load merch", "error");
            }
        }

        function renderMerch(items) {
            const list = document.getElementById('merch-list');
            list.innerHTML = '';

            items.forEach(item => {
                const col = document.createElement('div');
                col.className = 'col-md-3 mb-4';
                col.innerHTML = `
                    <div class="card h-100">
                        <img src="${item.image || 'https://via.placeholder.com/300'}" class="card-img-top" style="height: 150px; object-fit: cover;">
                        <div class="card-body">
                            <h6 class="card-title">${item.name}</h6>
                            <div class="d-flex justify-content-between">
                                <span class="text-success fw-bold">${formatCurrency(item.price)}</span>
                                <small class="text-muted">${item.department}</small>
                            </div>
                            <div class="mt-2">
                                <button class="btn btn-sm btn-outline-danger w-100" onclick="deleteMerch('${item._id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(col);
            });
        }

        let deleteTargetId = null;
        window.deleteMerch = function(id) {
            deleteTargetId = id;
            new bootstrap.Modal(document.getElementById('deleteConfirmModal')).show();
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if(deleteTargetId) {
                try {
                    await API.deleteMerch(deleteTargetId);
                    showToast("Item deleted", "success");
                    fetchMerch();
                    bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
                } catch(e) {
                    showToast("Failed to delete item", "error");
                }
            }
        });

        window.saveMerch = async function() {
            const name = document.getElementById('m-name').value;
            const price = document.getElementById('m-price').value;
            const category = document.getElementById('m-cat').value;
            const dept = document.getElementById('m-dept').value;
            const desc = document.getElementById('m-desc').value || category;
            const imageFile = document.getElementById('m-image-file').files[0];

            if(!name || !price) {
                showToast('Please fill required fields', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('price', price);
            formData.append('description', desc);
            formData.append('department', dept);
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                await API.createMerch(formData);
                showToast('Product added successfully!', 'success');

                const modalEl = document.getElementById('addMerchModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();

                // Clear form
                document.getElementById('add-merch-form').reset();
                fetchMerch();
            } catch (e) {
                showToast(e.message, "error");
            }
        }

        fetchMerch();
    </script>
</body>
</html>
