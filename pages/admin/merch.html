<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/assets/uc-central-logo.png" type="image/x-icon">
    <meta charset="UTF-8">
    <title>UC-Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Overview</span></a>
                <a class="nav-link" href="orders.html"><i class="fa-solid fa-list-check"></i> <span>Orders</span></a>
                <a class="nav-link" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link active" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch</span></a>
                <a class="nav-link" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> <span>Announcements</span></a>
                <a class="nav-link" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link" href="users.html"><i class="fa-solid fa-users"></i> <span>Users</span></a>
                <a class="nav-link" href="pos.html"><i class="fa-solid fa-cash-register"></i> <span>POS</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <button class="btn btn-light text-primary border-0" onclick="toggleSidebar()"><i class="fa-solid fa-bars fa-lg"></i></button>
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block">Admin Panel</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Merchandise Management</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addMerchModal"><i class="fa-solid fa-plus"></i> Add Product</button>
                </div>

                <div class="row" id="merch-list">
                    <!-- JS populated -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Merch Modal -->
    <div class="modal fade" id="addMerchModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-merch-form">
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" id="m-name" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price (PHP)</label>
                                <input type="number" id="m-price" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" id="m-stock" class="form-control" required min="0" value="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category (Description)</label>
                            <select id="m-cat" class="form-select">
                                <option value="Shirt">Shirt</option>
                                <option value="Hoodie">Hoodie</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Uniform">Uniform</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select id="m-dept" class="form-select">
                                <option value="ALL">All Departments</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image</label>
                            <input type="file" id="m-image-file" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Detailed Description</label>
                            <textarea id="m-desc" class="form-control" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveMerch()">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Merch Modal -->
    <div class="modal fade" id="editMerchModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title">Edit Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-merch-form">
                        <input type="hidden" id="edit-m-id">
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" id="edit-m-name" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price (PHP)</label>
                                <input type="number" id="edit-m-price" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" id="edit-m-stock" class="form-control" required min="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select id="edit-m-cat" class="form-select">
                                <option value="Shirt">Shirt</option>
                                <option value="Hoodie">Hoodie</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Uniform">Uniform</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select id="edit-m-dept" class="form-select">
                                <option value="ALL">All Departments</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Image (Optional)</label>
                            <input type="file" id="edit-m-image-file" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="edit-m-desc" class="form-control" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateMerch()">Update Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this item? This action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        const deptSelect = document.getElementById('m-dept');
        const editDeptSelect = document.getElementById('edit-m-dept');
        const departments = [
            {id: 'CCS', name: 'College of Computer Studies'},
            {id: 'CBA', name: 'College of Business Administration'},
            {id: 'CAS', name: 'College of Arts and Sciences'},
            {id: 'ALL', name: 'All Departments'}
        ];

        departments.forEach(d => {
            if(d.id !== 'ALL') {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.name;
                deptSelect.appendChild(opt);

                const opt2 = document.createElement('option');
                opt2.value = d.id;
                opt2.textContent = d.name;
                editDeptSelect.appendChild(opt2);
            }
        });

        let allMerch = [];

        async function fetchMerch() {
            try {
                allMerch = await API.getMerch();
                renderMerch(allMerch);
            } catch (e) {
                showToast("Failed to load merch", "error");
            }
        }

        function renderMerch(items) {
            const list = document.getElementById('merch-list');
            list.innerHTML = '';

            items.forEach(item => {
                const col = document.createElement('div');
                col.className = 'col-md-3 mb-4';
                col.innerHTML = `
                    <div class="card h-100">
                        <img src="${item.image || 'https://via.placeholder.com/300'}" class="card-img-top" style="height: 150px; object-fit: cover;">
                        <div class="card-body">
                            <h6 class="card-title text-truncate">${item.name}</h6>
                            <div class="d-flex justify-content-between">
                                <span class="text-success fw-bold">${formatCurrency(item.price)}</span>
                                <small class="text-muted">${item.department}</small>
                            </div>
                            <div class="mt-3 d-flex gap-2">
                                <button class="btn btn-sm btn-outline-primary w-50" onclick="openEditMerch('${item._id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                                <button class="btn btn-sm btn-outline-danger w-50" onclick="deleteMerch('${item._id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(col);
            });
        }

        let deleteTargetId = null;
        window.deleteMerch = function(id) {
            deleteTargetId = id;
            new bootstrap.Modal(document.getElementById('deleteConfirmModal')).show();
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if(deleteTargetId) {
                try {
                    await API.deleteMerch(deleteTargetId);
                    showToast("Item deleted", "success");
                    fetchMerch();
                    bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
                } catch(e) {
                    showToast("Failed to delete item", "error");
                }
            }
        });

        window.saveMerch = async function() {
            const name = document.getElementById('m-name').value;
            const price = document.getElementById('m-price').value;
            const stock = document.getElementById('m-stock').value;
            const category = document.getElementById('m-cat').value;
            const dept = document.getElementById('m-dept').value;
            const desc = document.getElementById('m-desc').value || category;
            const imageFile = document.getElementById('m-image-file').files[0];

            if(!name || !price) {
                showToast('Please fill required fields', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('price', price);
            formData.append('stock', stock);
            formData.append('description', desc);
            formData.append('department', dept);
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                await API.createMerch(formData);
                showToast('Product added successfully!', 'success');

                const modalEl = document.getElementById('addMerchModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();

                document.getElementById('add-merch-form').reset();
                fetchMerch();
            } catch (e) {
                showToast(e.message, "error");
            }
        }

        window.openEditMerch = function(id) {
            const item = allMerch.find(m => m._id === id);
            if(item) {
                document.getElementById('edit-m-id').value = item._id;
                document.getElementById('edit-m-name').value = item.name;
                document.getElementById('edit-m-price').value = item.price;
                document.getElementById('edit-m-stock').value = item.stock || 0;
                document.getElementById('edit-m-desc').value = item.description;
                document.getElementById('edit-m-dept').value = item.department || 'ALL';
                new bootstrap.Modal(document.getElementById('editMerchModal')).show();
            }
        }

        window.updateMerch = async function() {
            const id = document.getElementById('edit-m-id').value;
            const name = document.getElementById('edit-m-name').value;
            const price = document.getElementById('edit-m-price').value;
            const stock = document.getElementById('edit-m-stock').value;
            const desc = document.getElementById('edit-m-desc').value;
            const dept = document.getElementById('edit-m-dept').value;
            const imageFile = document.getElementById('edit-m-image-file').files[0];

            const formData = new FormData();
            formData.append('name', name);
            formData.append('price', price);
            formData.append('stock', stock);
            formData.append('description', desc);
            formData.append('department', dept);
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                await API.updateMerch(id, formData);
                showToast('Product updated!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('editMerchModal')).hide();
                fetchMerch();
            } catch(e) {
                showToast(e.message, "error");
            }
        }

        fetchMerch();
    </script>
</body>
</html>
