    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Event Management</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createEventModal"><i class="fa-solid fa-plus"></i> Create Event</button>
        </div>

        <div class="row" id="admin-events-grid">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- Create Event Modal -->
    <div class="modal fade" id="createEventModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Create New Event</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="create-event-form">
                        <div class="mb-3">
                            <label class="form-label">Event Title</label>
                            <input type="text" id="event-title" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" id="event-date" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Time</label>
                                <input type="time" id="event-time" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Venue</label>
                            <input type="text" id="event-venue" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select class="form-select" id="event-dept-select">
                                <option value="ALL">All Departments</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image</label>
                            <input type="file" id="event-image" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="event-desc" class="form-control" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="publishNewEvent()">Publish Event</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        // Check session using new Auth method if desired, but Auth.checkSession is auto-run
        // But we need to ensure admin role
        // Auth.checkSession redirects based on role, but here we are already on admin page.
        // Ideally Auth.checkSession handles redirect if student tries to access admin.

        const select = document.getElementById('event-dept-select');
        const departments = [
            {id: 'CCS', name: 'College of Computer Studies'},
            {id: 'CBA', name: 'College of Business Administration'},
            {id: 'CAS', name: 'College of Arts and Sciences'},
            {id: 'ALL', name: 'All Departments'}
        ];
        departments.forEach(dept => {
            if (dept.id !== 'ALL') {
                const opt = document.createElement('option');
                opt.value = dept.id;
                opt.textContent = dept.name;
                select.appendChild(opt);
            }
        });

        const grid = document.getElementById('admin-events-grid');

        async function fetchAdminEvents() {
            try {
                const events = await API.getEvents();
                renderAdminEvents(events);
            } catch (e) {
                showToast("Failed to load events", "error");
            }
        }

        function renderAdminEvents(events) {
            grid.innerHTML = '';
            events.forEach(event => {
                const col = document.createElement('div');
                col.className = 'col-md-4 mb-4';
                col.innerHTML = `
                    <div class="card h-100">
                         <div class="card-body">
                            <h5 class="card-title">${event.title}</h5>
                            <p class="text-muted small">${event.date} | ${event.department}</p>
                            <p class="small">${event.description}</p>
                            <div class="d-flex justify-content-end gap-2">
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteEvent('${event._id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        }

        window.deleteEvent = async function(id) {
            if(confirm("Are you sure you want to delete this event?")) {
                try {
                    await API.deleteEvent(id);
                    showToast("Event deleted", "success");
                    fetchAdminEvents();
                } catch(e) {
                    showToast("Failed to delete event", "error");
                }
            }
        }

        window.publishNewEvent = async function() {
            const title = document.getElementById('event-title').value;
            const date = document.getElementById('event-date').value;
            const time = document.getElementById('event-time').value;
            const venue = document.getElementById('event-venue').value;
            const dept = document.getElementById('event-dept-select').value;
            const desc = document.getElementById('event-desc').value;
            const imageFile = document.getElementById('event-image').files[0];

            if(!title || !date || !venue) {
                showToast("Please fill all required fields", "error");
                return;
            }

            const formData = new FormData();
            formData.append('title', title);
            formData.append('date', date);
            formData.append('time', time);
            formData.append('location', venue);
            formData.append('department', dept);
            formData.append('description', desc);
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                await API.createEvent(formData);
                showToast("Event published successfully!", "success");
                const modalEl = document.getElementById('createEventModal');
                const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                modal.hide();

                document.getElementById('create-event-form').reset();
                fetchAdminEvents();
            } catch (e) {
                console.error(e);
                showToast("Error creating event: " + e.message, "error");
            }
        }

        fetchAdminEvents();
    </script>
</body>
</html>
