<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/assets/uc-central-logo.png" type="image/x-icon">
    <meta charset="UTF-8">
    <title>UC-Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Overview</span></a>
                <a class="nav-link" href="orders.html"><i class="fa-solid fa-list-check"></i> <span>Orders</span></a>
                <a class="nav-link active" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch</span></a>
                <a class="nav-link" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> <span>Announcements</span></a>
                <a class="nav-link" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link" href="users.html"><i class="fa-solid fa-users"></i> <span>Users</span></a>
                <a class="nav-link" href="pos.html"><i class="fa-solid fa-cash-register"></i> <span>POS</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <button class="btn btn-light text-primary border-0" onclick="toggleSidebar()"><i class="fa-solid fa-bars fa-lg"></i></button>
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block">Admin Panel</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Event Management</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createEventModal"><i class="fa-solid fa-plus"></i> Create Event</button>
                </div>

                <div class="row" id="admin-events-grid">
                    <!-- Populated via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Create Event Modal -->
    <div class="modal fade" id="createEventModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Create New Event</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="create-event-form">
                        <div class="mb-3">
                            <label class="form-label">Event Title</label>
                            <input type="text" id="event-title" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" id="event-date" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Time</label>
                                <input type="time" id="event-time" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Venue</label>
                            <input type="text" id="event-venue" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select class="form-select" id="event-dept-select">
                                <option value="ALL">All Departments</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image</label>
                            <input type="file" id="event-image" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="event-desc" class="form-control" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="publishNewEvent()">Publish Event</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Event Modal -->
    <div class="modal fade" id="editEventModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title">Edit Event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-event-form">
                        <input type="hidden" id="edit-event-id">
                        <div class="mb-3">
                            <label class="form-label">Event Title</label>
                            <input type="text" id="edit-event-title" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" id="edit-event-date" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Time</label>
                                <input type="time" id="edit-event-time" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Venue</label>
                            <input type="text" id="edit-event-venue" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select class="form-select" id="edit-event-dept-select">
                                <option value="ALL">All Departments</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Image (Optional)</label>
                            <input type="file" id="edit-event-image" class="form-control" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="edit-event-desc" class="form-control" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateEvent()">Update Event</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this event? This action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        const select = document.getElementById('event-dept-select');
        const editSelect = document.getElementById('edit-event-dept-select');
        const departments = [
            {id: 'CCS', name: 'College of Computer Studies'},
            {id: 'CBA', name: 'College of Business Administration'},
            {id: 'CAS', name: 'College of Arts and Sciences'},
            {id: 'ALL', name: 'All Departments'}
        ];
        departments.forEach(dept => {
            if (dept.id !== 'ALL') {
                const opt = document.createElement('option');
                opt.value = dept.id;
                opt.textContent = dept.name;
                select.appendChild(opt);

                const opt2 = document.createElement('option');
                opt2.value = dept.id;
                opt2.textContent = dept.name;
                editSelect.appendChild(opt2);
            }
        });

        const grid = document.getElementById('admin-events-grid');
        let allEvents = [];

        async function fetchAdminEvents() {
            try {
                allEvents = await API.getEvents();
                renderAdminEvents(allEvents);
            } catch (e) {
                showToast("Failed to load events", "error");
            }
        }

        function renderAdminEvents(events) {
            grid.innerHTML = '';
            events.forEach(event => {
                const col = document.createElement('div');
                col.className = 'col-md-4 mb-4';
                col.innerHTML = `
                    <div class="card h-100">
                         <div class="card-body">
                            <h5 class="card-title">${event.title}</h5>
                            <p class="text-muted small">${event.date} | ${event.department}</p>
                            <p class="small">${event.description}</p>
                            <div class="d-flex justify-content-end gap-2">
                                <button class="btn btn-sm btn-outline-primary w-50" onclick="openEditEvent('${event._id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                                <button class="btn btn-sm btn-outline-danger w-50" onclick="deleteEvent('${event._id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        }

        let deleteTargetId = null;
        window.deleteEvent = function(id) {
            deleteTargetId = id;
            new bootstrap.Modal(document.getElementById('deleteConfirmModal')).show();
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if(deleteTargetId) {
                try {
                    await API.deleteEvent(deleteTargetId);
                    showToast("Event deleted", "success");
                    fetchAdminEvents();
                    bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
                } catch(e) {
                    showToast("Failed to delete event", "error");
                }
            }
        });

        window.publishNewEvent = async function() {
            const title = document.getElementById('event-title').value;
            const date = document.getElementById('event-date').value;
            const time = document.getElementById('event-time').value;
            const venue = document.getElementById('event-venue').value;
            const dept = document.getElementById('event-dept-select').value;
            const desc = document.getElementById('event-desc').value;
            const imageFile = document.getElementById('event-image').files[0];

            if(!title || !date || !venue) {
                showToast("Please fill all required fields", "error");
                return;
            }

            const formData = new FormData();
            formData.append('title', title);
            formData.append('date', date);
            formData.append('time', time);
            formData.append('location', venue);
            formData.append('department', dept);
            formData.append('description', desc);
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                await API.createEvent(formData);
                showToast("Event published successfully!", "success");
                const modalEl = document.getElementById('createEventModal');
                const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                modal.hide();

                document.getElementById('create-event-form').reset();
                fetchAdminEvents();
            } catch (e) {
                console.error(e);
                showToast("Error creating event: " + e.message, "error");
            }
        }

        window.openEditEvent = function(id) {
            const event = allEvents.find(e => e._id === id);
            if(event) {
                document.getElementById('edit-event-id').value = event._id;
                document.getElementById('edit-event-title').value = event.title;
                document.getElementById('edit-event-date').value = event.date;
                document.getElementById('edit-event-time').value = event.time || '';
                document.getElementById('edit-event-venue').value = event.location;
                document.getElementById('edit-event-dept-select').value = event.department;
                document.getElementById('edit-event-desc').value = event.description;
                new bootstrap.Modal(document.getElementById('editEventModal')).show();
            }
        }

        window.updateEvent = async function() {
            const id = document.getElementById('edit-event-id').value;
            const title = document.getElementById('edit-event-title').value;
            const date = document.getElementById('edit-event-date').value;
            const time = document.getElementById('edit-event-time').value;
            const venue = document.getElementById('edit-event-venue').value;
            const dept = document.getElementById('edit-event-dept-select').value;
            const desc = document.getElementById('edit-event-desc').value;
            const imageFile = document.getElementById('edit-event-image').files[0];

            const formData = new FormData();
            formData.append('title', title);
            formData.append('date', date);
            formData.append('time', time);
            formData.append('location', venue);
            formData.append('department', dept);
            formData.append('description', desc);
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                await API.updateEvent(id, formData);
                showToast("Event updated!", "success");
                bootstrap.Modal.getInstance(document.getElementById('editEventModal')).hide();
                fetchAdminEvents();
            } catch(e) {
                showToast(e.message, "error");
            }
        }

        fetchAdminEvents();
    </script>
</body>
</html>
