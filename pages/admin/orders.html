<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Orders - UC-Central Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <style>
        .admin-nav { background-color: #1e5636 !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark admin-nav sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-shield-halved me-2"></i>UC-Central Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Overview</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="orders.html">Orders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="events.html">Manage Events</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                     <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4">Order Management</h2>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Student</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table">
                            <!-- Mock Data Rows -->
                            <tr>
                                <td>#ORD-001</td>
                                <td>John Doe (123456)</td>
                                <td>CICT Shirt (1)</td>
                                <td>PHP 350.00</td>
                                <td><span class="badge bg-warning text-dark">Pending</span></td>
                                <td>
                                    <button class="btn btn-sm btn-success" onclick="updateStatus(this, 'Completed')"><i class="fa-solid fa-check"></i> Approve</button>
                                    <button class="btn btn-sm btn-danger" onclick="updateStatus(this, 'Declined')"><i class="fa-solid fa-xmark"></i> Decline</button>
                                </td>
                            </tr>
                            <tr>
                                <td>#ORD-004</td>
                                <td>Alice Wonderland (987654)</td>
                                <td>UC Lanyard (2)</td>
                                <td>PHP 300.00</td>
                                <td><span class="badge bg-info">Processing</span></td>
                                <td>
                                    <button class="btn btn-sm btn-success" onclick="updateStatus(this, 'Ready for Pickup')">Ready</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.requireAdmin();

        function updateStatus(btn, status) {
            const row = btn.closest('tr');
            const badge = row.querySelector('.badge');

            badge.className = 'badge'; // reset
            badge.textContent = status;

            if (status === 'Completed' || status === 'Ready for Pickup') badge.classList.add('bg-success');
            else if (status === 'Declined') badge.classList.add('bg-danger');
            else badge.classList.add('bg-secondary');

            showToast(`Order status updated to ${status}`, 'success');
        }
    </script>
</body>
</html>
