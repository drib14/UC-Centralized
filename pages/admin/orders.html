<html lang="en">

    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark admin-nav sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-shield-halved me-2"></i>UC-Central Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Overview</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="orders.html">Orders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="events.html">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="merch.html">Merch</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="announcements.html">Announcements</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="messages.html">Messages</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                     <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4">Order Management</h2>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Student</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table">
                            <!-- JS Populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.requireAdmin();

        function renderOrders() {
            const tbody = document.getElementById('orders-table');
            tbody.innerHTML = '';
            const orders = DB.getOrders();

            if (orders.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="6" class="text-center">No orders found.</td></tr>';
                 return;
            }

            orders.forEach(order => {
                let badgeClass = 'bg-secondary';
                if (order.status === 'Pending') badgeClass = 'bg-warning text-dark';
                else if (order.status === 'Completed' || order.status === 'Ready for Pickup') badgeClass = 'bg-success';
                else if (order.status === 'Processing') badgeClass = 'bg-info';
                else if (order.status === 'Declined') badgeClass = 'bg-danger';

                const itemsSummary = order.items.map(i => `${i.name} (${i.quantity})`).join(', ');

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${order.id}</td>
                    <td>${order.studentName} <br><small class="text-muted">${order.studentId}</small></td>
                    <td>${itemsSummary}</td>
                    <td>${formatCurrency(order.total)}</td>
                    <td><span class="badge ${badgeClass}">${order.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-success" onclick="updateStatus('${order.id}', 'Processing')">Process</button>
                        <button class="btn btn-sm btn-outline-info" onclick="updateStatus('${order.id}', 'Ready for Pickup')">Ready</button>
                        <button class="btn btn-sm btn-outline-dark" onclick="updateStatus('${order.id}', 'Completed')">Complete</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="updateStatus('${order.id}', 'Declined')">Decline</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateStatus(orderId, status) {
            DB.updateOrderStatus(orderId, status);
            showToast(`Order status updated to ${status}`, 'success');
            renderOrders();
        }

        renderOrders();
    </script>
</body>
</html>
