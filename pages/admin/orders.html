<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/assets/uc-central-logo.png" type="image/x-icon">
    <meta charset="UTF-8">
    <title>UC-Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Overview</span></a>
                <a class="nav-link active" href="orders.html"><i class="fa-solid fa-list-check"></i> <span>Orders</span></a>
                <a class="nav-link" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch</span></a>
                <a class="nav-link" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> <span>Announcements</span></a>
                <a class="nav-link" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link" href="users.html"><i class="fa-solid fa-users"></i> <span>Users</span></a>
                <a class="nav-link" href="pos.html"><i class="fa-solid fa-cash-register"></i> <span>POS</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <button class="btn btn-light text-primary border-0" onclick="toggleSidebar()"><i class="fa-solid fa-bars fa-lg"></i></button>
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block">Admin Panel</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
                <h2 class="mb-4">Order Management</h2>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Customer</th>
                                        <th>Items</th>
                                        <th>Total</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="orders-table">
                                    <!-- JS Populated -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- View Order Modal -->
    <div class="modal fade" id="viewOrderModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Order Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="vo-oid">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <h6>Customer Info</h6>
                            <p id="vo-customer" class="mb-1 fw-bold"></p>
                            <small id="vo-id" class="text-muted"></small>
                        </div>
                        <div class="col-md-6 text-end">
                            <h6>Order Info</h6>
                            <p id="vo-order-id" class="mb-1 font-monospace"></p>
                            <p id="vo-date" class="small text-muted"></p>
                        </div>
                    </div>
                    <h6 class="mb-2">Items</h6>
                    <table class="table table-sm table-bordered mb-3">
                        <thead class="table-light"><tr><th>Item</th><th>Qty</th><th class="text-end">Price</th></tr></thead>
                        <tbody id="vo-items"></tbody>
                        <tfoot><tr><th colspan="2" class="text-end">Total</th><th class="text-end" id="vo-total"></th></tr></tfoot>
                    </table>

                    <div class="bg-light p-3 rounded">
                        <label class="form-label fw-bold me-2">Update Status:</label>
                        <select id="vo-status" class="form-select w-auto d-inline-block">
                            <option value="pending">Pending</option>
                            <option value="processing">Processing</option>
                            <option value="claimed">Claimed/Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveOrderStatus()">Update Status</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.checkSession();

        let allOrders = [];

        async function fetchOrders() {
            try {
                allOrders = await API.getOrders();
                renderOrders(allOrders);
            } catch(e) {
                showToast("Failed to load orders", "error");
            }
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('orders-table');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="6" class="text-center">No orders found.</td></tr>';
                 return;
            }

            orders.forEach(order => {
                let badgeClass = 'bg-secondary';
                const status = order.status;
                if (status === 'pending') badgeClass = 'bg-warning text-dark';
                else if (status === 'claimed') badgeClass = 'bg-success';
                else if (status === 'processing') badgeClass = 'bg-info text-white';
                else if (status === 'cancelled') badgeClass = 'bg-danger';

                const u = order.user;
                const user = u ? ( (u.firstName && u.lastName) ? `${u.firstName} ${u.lastName}` : (u.name || 'Unknown User') ) : (order.customerName || 'Walk-in');
                const userId = order.user ? order.user.studentId : '-';
                const itemsSummary = order.items.map(i => i.merch ? `${i.merch.name} (${i.quantity})` : 'Unknown').join(', ');

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>#${order._id.slice(-6).toUpperCase()}</td>
                    <td>${user} <br><small class="text-muted">${userId}</small></td>
                    <td>${itemsSummary}</td>
                    <td>${formatCurrency(order.totalPrice)}</td>
                    <td><span class="badge ${badgeClass}">${status.toUpperCase()}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="openViewOrder('${order._id}')">
                            <i class="fa-solid fa-eye"></i> View / Update
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        window.openViewOrder = function(id) {
            const order = allOrders.find(o => o._id === id);
            if(order) {
                const u = order.user;
                const user = u ? ( (u.firstName && u.lastName) ? `${u.firstName} ${u.lastName}` : (u.name || 'Unknown User') ) : (order.customerName || 'Walk-in');
                const userId = order.user ? order.user.studentId : 'N/A';

                document.getElementById('vo-oid').value = order._id;
                document.getElementById('vo-customer').textContent = user;
                document.getElementById('vo-id').textContent = `ID: ${userId}`;
                document.getElementById('vo-order-id').textContent = `#${order._id.toUpperCase()}`;
                document.getElementById('vo-date').textContent = new Date(order.createdAt).toLocaleString();
                document.getElementById('vo-total').textContent = formatCurrency(order.totalPrice);
                document.getElementById('vo-status').value = order.status;

                const tbody = document.getElementById('vo-items');
                tbody.innerHTML = '';
                order.items.forEach(item => {
                    const name = item.merch ? item.merch.name : 'Deleted Item';
                    const price = item.merch ? item.merch.price : 0;
                    tbody.innerHTML += `
                        <tr>
                            <td>${name}</td>
                            <td>${item.quantity}</td>
                            <td class="text-end">${formatCurrency(price * item.quantity)}</td>
                        </tr>
                    `;
                });

                new bootstrap.Modal(document.getElementById('viewOrderModal')).show();
            }
        }

        window.saveOrderStatus = async function() {
            const orderId = document.getElementById('vo-oid').value;
            const status = document.getElementById('vo-status').value;

            try {
                await API.updateOrderStatus(orderId, status);
                showToast(`Order status updated to ${status}`, 'success');
                bootstrap.Modal.getInstance(document.getElementById('viewOrderModal')).hide();
                fetchOrders();
            } catch(e) {
                showToast(e.message, "error");
            }
        }

        fetchOrders();
    </script>
</body>
</html>
