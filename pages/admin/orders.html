    <div class="container py-4">
        <h2 class="mb-4">Order Management</h2>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table">
                            <!-- JS Populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.checkSession();

        async function fetchOrders() {
            try {
                const orders = await API.getOrders();
                renderOrders(orders);
            } catch(e) {
                showToast("Failed to load orders", "error");
            }
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('orders-table');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="6" class="text-center">No orders found.</td></tr>';
                 return;
            }

            orders.forEach(order => {
                let badgeClass = 'bg-secondary';
                const status = order.status;
                if (status === 'pending') badgeClass = 'bg-warning text-dark';
                else if (status === 'claimed') badgeClass = 'bg-success';
                else if (status === 'processing') badgeClass = 'bg-info text-white';
                else if (status === 'cancelled') badgeClass = 'bg-danger';

                const u = order.user;
                const user = u ? ( (u.firstName && u.lastName) ? `${u.firstName} ${u.lastName}` : (u.name || 'Unknown User') ) : (order.customerName || 'Walk-in');
                const userId = order.user ? order.user.studentId : '-';
                const itemsSummary = order.items.map(i => i.merch ? `${i.merch.name} (${i.quantity})` : 'Unknown').join(', ');

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>#${order._id.slice(-6).toUpperCase()}</td>
                    <td>${user} <br><small class="text-muted">${userId}</small></td>
                    <td>${itemsSummary}</td>
                    <td>${formatCurrency(order.totalPrice)}</td>
                    <td><span class="badge ${badgeClass}">${status.toUpperCase()}</span></td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-info" onclick="updateStatus('${order._id}', 'processing')">Process</button>
                            <button class="btn btn-outline-success" onclick="updateStatus('${order._id}', 'claimed')">Claimed</button>
                            <button class="btn btn-outline-danger" onclick="updateStatus('${order._id}', 'cancelled')">Cancel</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function updateStatus(orderId, status) {
            try {
                await API.updateOrderStatus(orderId, status);
                showToast(`Order status updated to ${status}`, 'success');
                fetchOrders();
            } catch(e) {
                showToast(e.message, "error");
            }
        }

        fetchOrders();
    </script>
