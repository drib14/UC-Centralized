<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/assets/uc-central-logo.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC-Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Overview</span></a>
                <a class="nav-link" href="orders.html"><i class="fa-solid fa-list-check"></i> <span>Orders</span></a>
                <a class="nav-link" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch</span></a>
                <a class="nav-link" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> <span>Announcements</span></a>
                <a class="nav-link active" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link" href="users.html"><i class="fa-solid fa-users"></i> <span>Users</span></a>
                <a class="nav-link" href="pos.html"><i class="fa-solid fa-cash-register"></i> <span>POS</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block">Admin Panel</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
                <h2 class="mb-4">Student Inquiries</h2>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Date</th>
                                        <th>Student</th>
                                        <th>Department</th>
                                        <th>Subject</th>
                                        <th>Message</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="messages-table">
                                    <!-- JS Populated -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reply Modal (Mock) -->
    <div class="modal fade" id="replyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Reply to Message</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p><strong>To:</strong> <span id="reply-student"></span></p>
                    <p><strong>Subject:</strong> <span id="reply-subject"></span></p>
                    <textarea class="form-control" rows="5" placeholder="Type your reply here..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="sendReply()">Send Reply</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.checkSession();

        const MESSAGES_KEY = 'ucc_messages_local';
        function getLocalMessages() {
            return JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
        }

        function renderMessages() {
            const tbody = document.getElementById('messages-table');
            tbody.innerHTML = '';
            const messages = getLocalMessages();

            if (messages.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="6" class="text-center">No messages found.</td></tr>';
                 return;
            }

            messages.forEach(msg => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${new Date(msg.date).toLocaleDateString()}</td>
                    <td>${msg.studentId}</td>
                    <td><span class="badge bg-secondary">${msg.toDept}</span></td>
                    <td class="fw-bold">${msg.subject}</td>
                    <td>${msg.body.substring(0, 50)}...</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="openReply('${msg.studentId}', '${msg.subject}')">
                            <i class="fa-solid fa-reply"></i> Reply
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        window.openReply = function(student, subject) {
            document.getElementById('reply-student').textContent = student;
            document.getElementById('reply-subject').textContent = "Re: " + subject;
            new bootstrap.Modal(document.getElementById('replyModal')).show();
        }

        window.sendReply = function() {
            showToast('Reply sent successfully!', 'success');
            bootstrap.Modal.getInstance(document.getElementById('replyModal')).hide();
        }

        renderMessages();
    </script>
</body>
</html>
