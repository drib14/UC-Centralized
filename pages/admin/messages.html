    <div class="container py-4">
        <h2 class="mb-4">Student Inquiries</h2>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Student</th>
                                <th>Department</th>
                                <th>Subject</th>
                                <th>Message</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="messages-table">
                            <!-- JS Populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Reply Modal (Mock) -->
    <div class="modal fade" id="replyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Reply to Message</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p><strong>To:</strong> <span id="reply-student"></span></p>
                    <p><strong>Subject:</strong> <span id="reply-subject"></span></p>
                    <textarea class="form-control" rows="5" placeholder="Type your reply here..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="sendReply()">Send Reply</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.requireAdmin();

        function renderMessages() {
            const tbody = document.getElementById('messages-table');
            tbody.innerHTML = '';
            const messages = DB.getMessages();

            if (messages.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="6" class="text-center">No messages found.</td></tr>';
                 return;
            }

            messages.forEach(msg => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${new Date(msg.date).toLocaleDateString()}</td>
                    <td>${msg.studentId}</td>
                    <td><span class="badge bg-secondary">${msg.toDept}</span></td>
                    <td class="fw-bold">${msg.subject}</td>
                    <td>${msg.body.substring(0, 50)}...</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="openReply('${msg.studentId}', '${msg.subject}')">
                            <i class="fa-solid fa-reply"></i> Reply
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function openReply(student, subject) {
            document.getElementById('reply-student').textContent = student;
            document.getElementById('reply-subject').textContent = "Re: " + subject;
            new bootstrap.Modal(document.getElementById('replyModal')).show();
        }

        function sendReply() {
            showToast('Reply sent successfully!', 'success');
            bootstrap.Modal.getInstance(document.getElementById('replyModal')).hide();
        }

        renderMessages();
    </script>
