<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/assets/uc-central-logo.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC-Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Overview</span></a>
                <a class="nav-link" href="orders.html"><i class="fa-solid fa-list-check"></i> <span>Orders</span></a>
                <a class="nav-link" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch</span></a>
                <a class="nav-link" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> <span>Announcements</span></a>
                <a class="nav-link" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link active" href="users.html"><i class="fa-solid fa-users"></i> <span>Users</span></a>
                <a class="nav-link" href="pos.html"><i class="fa-solid fa-cash-register"></i> <span>POS</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block">Admin Panel</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>User Management</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal"><i class="fa-solid fa-user-plus"></i> Add Admin</button>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Student ID</th>
                                        <th>Name</th>
                                        <th>Department</th>
                                        <th>Role</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="users-table">
                                    <!-- JS Populated -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Admin Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Add New Admin</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-user-form">
                        <div class="mb-3">
                            <label class="form-label">ID Number (Login)</label>
                            <input type="number" id="u-id" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" id="u-fname" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" id="u-lname" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="u-pass" class="form-control" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addAdminUser()">Create Admin</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal fade" id="editUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-user-form">
                        <input type="hidden" id="edit-u-id">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" id="edit-u-fname" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" id="edit-u-lname" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" id="edit-u-dept" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select id="edit-u-role" class="form-select">
                                <option value="student">Student</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveUserChanges()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Delete this user?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.checkSession();

        let allUsers = [];

        async function fetchUsers() {
            try {
                allUsers = await API.getUsers();
                renderUsers(allUsers);
            } catch(e) {
                showToast("Failed to load users", "error");
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('users-table');
            tbody.innerHTML = '';
            const currentUser = Auth.getCurrentUser();

            users.forEach(user => {
                const row = document.createElement('tr');
                const isMe = currentUser.studentId === user.studentId;
                const roleBadge = user.role === 'admin' ? 'bg-danger' : 'bg-secondary';
                const displayName = (user.firstName && user.lastName) ? `${user.firstName} ${user.lastName}` : (user.name || 'Unknown');

                row.innerHTML = `
                    <td>${user.studentId}</td>
                    <td>${displayName}</td>
                    <td>${user.department || 'N/A'}</td>
                    <td><span class="badge ${roleBadge} text-uppercase">${user.role}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="openEditUser('${user._id}')" ${isMe ? 'disabled' : ''}>
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteUser('${user._id}')" ${isMe ? 'disabled' : ''}>
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        let deleteTargetId = null;
        window.deleteUser = function(id) {
            deleteTargetId = id;
            new bootstrap.Modal(document.getElementById('deleteConfirmModal')).show();
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if(deleteTargetId) {
                try {
                    await API.deleteUser(deleteTargetId);
                    showToast("User deleted", "success");
                    fetchUsers();
                    bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
                } catch(e) {
                    showToast("Failed to delete user", "error");
                }
            }
        });

        window.openEditUser = function(id) {
            const user = allUsers.find(u => u._id === id);
            if(user) {
                document.getElementById('edit-u-id').value = user._id;
                document.getElementById('edit-u-fname').value = user.firstName || '';
                document.getElementById('edit-u-lname').value = user.lastName || '';
                document.getElementById('edit-u-dept').value = user.department || '';
                document.getElementById('edit-u-role').value = user.role;
                new bootstrap.Modal(document.getElementById('editUserModal')).show();
            }
        }

        window.saveUserChanges = async function() {
            const id = document.getElementById('edit-u-id').value;
            const firstName = document.getElementById('edit-u-fname').value;
            const lastName = document.getElementById('edit-u-lname').value;
            const dept = document.getElementById('edit-u-dept').value;
            const role = document.getElementById('edit-u-role').value;

            try {
                await API.updateUser(id, {
                    firstName,
                    lastName,
                    department: dept,
                    role
                });
                showToast("User updated!", "success");
                bootstrap.Modal.getInstance(document.getElementById('editUserModal')).hide();
                fetchUsers();
            } catch(e) {
                showToast(e.message, "error");
            }
        }

        async function addAdminUser() {
            const studentId = document.getElementById('u-id').value;
            const firstName = document.getElementById('u-fname').value;
            const lastName = document.getElementById('u-lname').value;
            const password = document.getElementById('u-pass').value;

            if(!studentId || !firstName || !lastName || !password) {
                showToast("All fields required", "error");
                return;
            }

            try {
                await API.register({
                    studentId,
                    email: studentId + '@admin.uc-central.com',
                    firstName,
                    lastName,
                    password,
                    department: 'ADMIN',
                    role: 'admin',
                    year: 'N/A',
                    program: 'N/A'
                });
                showToast("Admin added successfully!", "success");
                bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
                fetchUsers();
            } catch (e) {
                showToast(e.message, "error");
            }
        }

        fetchUsers();
    </script>
</body>
</html>
