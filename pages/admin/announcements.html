<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Announcements - UC-Central Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <style>
        .admin-nav { background-color: #1e5636 !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark admin-nav sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-shield-halved me-2"></i>UC-Central Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Overview</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="orders.html">Orders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="events.html">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="merch.html">Merch</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="announcements.html">Announcements</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                     <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Announcements</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addAnnModal"><i class="fa-solid fa-plus"></i> Post Announcement</button>
        </div>

        <div class="list-group" id="ann-list">
            <!-- JS populated -->
        </div>
    </div>

    <!-- Add Announcement Modal -->
    <div class="modal fade" id="addAnnModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Post New Announcement</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-ann-form">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" id="a-title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea id="a-msg" class="form-control" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Target Audience (Department)</label>
                            <select id="a-dept" class="form-select">
                                <option value="ALL">All Departments</option>
                                <!-- Populated via JS -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="saveAnnouncement()">Post Now</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.requireAdmin();

        // Populate Dept
        const deptSelect = document.getElementById('a-dept');
        if(window.MockData) {
            window.MockData.departments.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.textContent = d.name;
                deptSelect.appendChild(opt);
            });
        }

        function renderAnnouncements() {
            const list = document.getElementById('ann-list');
            list.innerHTML = '';
            const items = DB.getAnnouncements();

            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'list-group-item list-group-item-action';
                el.innerHTML = `
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">${item.title}</h5>
                        <small class="text-muted">${item.date}</small>
                    </div>
                    <p class="mb-1">${item.message}</p>
                    <small class="text-primary">Target: ${item.dept}</small>
                `;
                list.appendChild(el);
            });
        }

        function saveAnnouncement() {
            const title = document.getElementById('a-title').value;
            const message = document.getElementById('a-msg').value;
            const dept = document.getElementById('a-dept').value;

            if(!title || !message) {
                showToast('Please fill required fields', 'error');
                return;
            }

            DB.addAnnouncement({
                title,
                message,
                dept,
                author: 'Admin'
            });
            showToast('Announcement posted!', 'success');

            const modalEl = document.getElementById('addAnnModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            document.getElementById('add-ann-form').reset();
            renderAnnouncements();
        }

        renderAnnouncements();
    </script>
</body>
</html>
