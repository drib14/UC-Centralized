<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/assets/uc-central-logo.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC-Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Overview</span></a>
                <a class="nav-link" href="orders.html"><i class="fa-solid fa-list-check"></i> <span>Orders</span></a>
                <a class="nav-link" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch</span></a>
                <a class="nav-link active" href="announcements.html"><i class="fa-solid fa-bullhorn"></i> <span>Announcements</span></a>
                <a class="nav-link" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link" href="users.html"><i class="fa-solid fa-users"></i> <span>Users</span></a>
                <a class="nav-link" href="pos.html"><i class="fa-solid fa-cash-register"></i> <span>POS</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block">Admin Panel</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Announcements</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAnnModal"><i class="fa-solid fa-plus"></i> Post Announcement</button>
                </div>

                <div class="list-group" id="ann-list">
                    <!-- JS populated -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Announcement Modal -->
    <div class="modal fade" id="addAnnModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Post New Announcement</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-ann-form">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" id="a-title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea id="a-msg" class="form-control" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Target Audience (Department)</label>
                            <select id="a-dept" class="form-select">
                                <option value="ALL">All Departments</option>
                                <!-- Populated via JS -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveAnnouncement()">Post Now</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Delete this announcement?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.checkSession();

        const deptSelect = document.getElementById('a-dept');
        const departments = [
            {id: 'CCS', name: 'College of Computer Studies'},
            {id: 'CBA', name: 'College of Business Administration'},
            {id: 'CAS', name: 'College of Arts and Sciences'},
            {id: 'ALL', name: 'All Departments'}
        ];

        departments.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.id;
            opt.textContent = d.name;
            deptSelect.appendChild(opt);
        });

        async function fetchAnnouncements() {
            try {
                const items = await API.getAnnouncements();
                renderAnnouncements(items);
            } catch(e) {
                showToast("Failed to load announcements", "error");
            }
        }

        function renderAnnouncements(items) {
            const list = document.getElementById('ann-list');
            list.innerHTML = '';

            items.forEach(item => {
                const date = new Date(item.date).toLocaleDateString();
                const el = document.createElement('div');
                el.className = 'list-group-item list-group-item-action';
                el.innerHTML = `
                    <div class="d-flex w-100 justify-content-between align-items-center">
                        <h5 class="mb-1">${item.title}</h5>
                        <small class="text-muted">${date}</small>
                    </div>
                    <p class="mb-1">${item.message}</p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <small class="text-primary">Target: ${item.department}</small>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteAnnouncement('${item._id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        let deleteTargetId = null;
        window.deleteAnnouncement = function(id) {
            deleteTargetId = id;
            new bootstrap.Modal(document.getElementById('deleteConfirmModal')).show();
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if(deleteTargetId) {
                try {
                    await API.deleteAnnouncement(deleteTargetId);
                    showToast("Announcement deleted", "success");
                    fetchAnnouncements();
                    bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
                } catch(e) {
                    showToast("Failed to delete announcement", "error");
                }
            }
        });

        window.saveAnnouncement = async function() {
            const title = document.getElementById('a-title').value;
            const message = document.getElementById('a-msg').value;
            const dept = document.getElementById('a-dept').value;

            if(!title || !message) {
                showToast('Please fill required fields', 'error');
                return;
            }

            try {
                await API.createAnnouncement({
                    title,
                    message,
                    department: dept
                });
                showToast('Announcement posted!', 'success');

                const modalEl = document.getElementById('addAnnModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();

                document.getElementById('add-ann-form').reset();
                fetchAnnouncements();
            } catch(e) {
                showToast(e.message, "error");
            }
        }

        fetchAnnouncements();
    </script>
</body>
</html>
