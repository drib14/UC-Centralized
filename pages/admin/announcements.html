</head>

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns me-1"></i> Overview</a>
                    </li>

                    <li class="nav-item">

                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="merch.html"><i class="fa-solid fa-shirt me-1"></i> Merch</a>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Announcements</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAnnModal"><i class="fa-solid fa-plus"></i> Post Announcement</button>
        </div>

        <div class="list-group" id="ann-list">
            <!-- JS populated -->
        </div>
    </div>

    <!-- Add Announcement Modal -->
    <div class="modal fade" id="addAnnModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Post New Announcement</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-ann-form">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" id="a-title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea id="a-msg" class="form-control" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Target Audience (Department)</label>
                            <select id="a-dept" class="form-select">
                                <option value="ALL">All Departments</option>
                                <!-- Populated via JS -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveAnnouncement()">Post Now</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Delete this announcement?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.checkSession();

        const deptSelect = document.getElementById('a-dept');
        const departments = [
            {id: 'CCS', name: 'College of Computer Studies'},
            {id: 'CBA', name: 'College of Business Administration'},
            {id: 'CAS', name: 'College of Arts and Sciences'},
            {id: 'ALL', name: 'All Departments'}
        ];

        departments.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.id;
            opt.textContent = d.name;
            deptSelect.appendChild(opt);
        });

        async function fetchAnnouncements() {
            try {
                const items = await API.getAnnouncements();
                renderAnnouncements(items);
            } catch(e) {
                showToast("Failed to load announcements", "error");
            }
        }

        function renderAnnouncements(items) {
            const list = document.getElementById('ann-list');
            list.innerHTML = '';

            items.forEach(item => {
                const date = new Date(item.date).toLocaleDateString();
                const el = document.createElement('div');
                el.className = 'list-group-item list-group-item-action';
                el.innerHTML = `
                    <div class="d-flex w-100 justify-content-between align-items-center">
                        <h5 class="mb-1">${item.title}</h5>
                        <small class="text-muted">${date}</small>
                    </div>
                    <p class="mb-1">${item.message}</p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <small class="text-primary">Target: ${item.department}</small>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteAnnouncement('${item._id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        let deleteTargetId = null;
        window.deleteAnnouncement = function(id) {
            deleteTargetId = id;
            new bootstrap.Modal(document.getElementById('deleteConfirmModal')).show();
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if(deleteTargetId) {
                try {
                    await API.deleteAnnouncement(deleteTargetId);
                    showToast("Announcement deleted", "success");
                    fetchAnnouncements();
                    bootstrap.Modal.getInstance(document.getElementById('deleteConfirmModal')).hide();
                } catch(e) {
                    showToast("Failed to delete announcement", "error");
                }
            }
        });

        window.saveAnnouncement = async function() {
            const title = document.getElementById('a-title').value;
            const message = document.getElementById('a-msg').value;
            const dept = document.getElementById('a-dept').value;

            if(!title || !message) {
                showToast('Please fill required fields', 'error');
                return;
            }

            try {
                await API.createAnnouncement({
                    title,
                    message,
                    department: dept
                });
                showToast('Announcement posted!', 'success');

                const modalEl = document.getElementById('addAnnModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();

                document.getElementById('add-ann-form').reset();
                fetchAnnouncements();
            } catch(e) {
                showToast(e.message, "error");
            }
        }

        fetchAnnouncements();
    </script>
</body>
</html>
