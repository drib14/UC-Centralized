<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="shortcut icon"
      href="/assets/uc-central-logo.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <title>UC-Central</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body>
    <!-- Nav (Could be modularized, but copy-pasting for Vanilla JS simplicity per plan) -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html"
          ><i class="fa-solid fa-school me-2"></i>UC-Central</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="events.html">Events</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="merch.html">Merch Store</a>
            </li>
          </ul>
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item me-3">
              <a class="nav-link position-relative" href="cart.html">
                <i class="fa-solid fa-cart-shopping fa-lg"></i>
                <span
                  id="cart-badge"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
                >
                  0
                </span>
              </a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="userDropdown"
                role="button"
                data-bs-toggle="dropdown"
              >
                <span id="nav-user-name">Student</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="profile.html">Profile</a>
                </li>
                <li>
                  <a class="dropdown-item text-danger" href="#" id="logout-btn"
                    >Logout</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <h2 class="mb-4 text-success">
        <i class="fa-solid fa-calendar-days me-2"></i>Events & Activities
      </h2>

      <!-- Filters -->
      <div class="row mb-4">
        <div class="col-md-4">
          <select class="form-select" id="dept-filter">
            <option value="ALL">All Departments</option>
            <!-- Populated via JS -->
          </select>
        </div>
      </div>

      <!-- Events Grid -->
      <div class="row" id="events-grid">
        <!-- Populated via JS -->
      </div>
    </div>

    <!-- Event Modal -->
    <div class="modal fade" id="eventModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title" id="modalTitle">Event Title</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <img
              src=""
              id="modalImage"
              class="img-fluid rounded mb-3 w-100"
              style="max-height: 300px; object-fit: cover"
            />
            <div class="row mb-2">
              <div class="col-md-6">
                <strong
                  ><i class="fa-regular fa-calendar me-2"></i>Date:</strong
                >
                <span id="modalDate"></span>
              </div>
              <div class="col-md-6">
                <strong><i class="fa-regular fa-clock me-2"></i>Time:</strong>
                <span id="modalTime"></span>
              </div>
            </div>
            <p>
              <strong
                ><i class="fa-solid fa-location-dot me-2"></i>Venue:</strong
              >
              <span id="modalVenue"></span>
            </p>
            <hr />
            <p id="modalDesc"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="showToast('Successfully registered for event!', 'success');"
              data-bs-dismiss="modal"
            >
              Register / RSVP
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      Auth.requireLogin();
      const currentUser = Auth.getCurrentUser();

      const grid = document.getElementById("events-grid");
      const deptFilter = document.getElementById("dept-filter");

      // Populate Filters
      window.MockData.departments.forEach((dept) => {
        const option = document.createElement("option");
        option.value = dept.id;
        option.textContent = dept.name;
        deptFilter.appendChild(option);
      });

      function renderEvents(filterDept = "ALL") {
        grid.innerHTML = "";
        let events = DB.getEvents();

        if (filterDept !== "ALL") {
          events = events.filter(
            (e) => e.department === filterDept || e.department === "ALL"
          );
        }

        events.forEach((event) => {
          const isRegistered = DB.hasRSVPd(currentUser.studentId, event.id);
          const btnClass = isRegistered
            ? "btn-secondary"
            : "btn-outline-success";
          const btnText = isRegistered ? "Registered" : "View Details";

          const col = document.createElement("div");
          col.className = "col-md-4 mb-4";
          col.innerHTML = `
                    <div class="card h-100">
                        <img src="${event.image}" class="card-img-top" alt="${
            event.title
          }" style="height: 200px; object-fit: cover;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${event.title}</h5>
                            <p class="card-text text-muted small mb-2">
                                <i class="fa-regular fa-calendar"></i> ${
                                  event.date
                                } | ${event.department}
                            </p>
                            <p class="card-text flex-grow-1">${event.description.substring(
                              0,
                              80
                            )}...</p>
                            <button class="btn ${btnClass} w-100 mt-auto" onclick="openEventModal(${
            event.id
          })">${btnText}</button>
                        </div>
                    </div>
                `;
          grid.appendChild(col);
        });
      }

      let currentEventId = null;

      function openEventModal(id) {
        const event = DB.getEvents().find((e) => e.id === id);
        if (!event) return;
        currentEventId = id;

        document.getElementById("modalTitle").textContent = event.title;
        document.getElementById("modalImage").src = event.image;
        document.getElementById("modalDate").textContent = event.date;
        document.getElementById("modalTime").textContent = event.time;
        document.getElementById("modalVenue").textContent = event.venue;
        document.getElementById("modalDesc").textContent = event.description;

        // Update Modal Button State
        const modalBtn = document.querySelector("#eventModal .btn-success");
        const isRegistered = DB.hasRSVPd(currentUser.studentId, id);

        if (isRegistered) {
          modalBtn.textContent = "Already Registered";
          modalBtn.disabled = true;
          modalBtn.onclick = null;
        } else {
          modalBtn.textContent = "Register / RSVP";
          modalBtn.disabled = false;
          modalBtn.onclick = handleRSVP;
        }

        new bootstrap.Modal(document.getElementById("eventModal")).show();
      }

      function handleRSVP() {
        if (currentEventId) {
          const success = DB.addRSVP(currentUser.studentId, currentEventId);
          if (success) {
            showToast("Successfully registered for event!", "success");
            renderEvents(deptFilter.value); // Re-render to show "Registered" on card
          } else {
            showToast("Already registered.", "info");
          }
        }
      }

      deptFilter.addEventListener("change", (e) =>
        renderEvents(e.target.value)
      );

      // Initial Render
      renderEvents();
    </script>
  </body>
</html>
