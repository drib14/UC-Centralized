    <div class="container py-4">
      <h2 class="mb-4 text-success">
        <i class="fa-solid fa-calendar-days me-2"></i>Events & Activities
      </h2>

      <!-- Filters -->
      <div class="row mb-4">
        <div class="col-md-4">
          <select class="form-select" id="dept-filter">
            <option value="ALL">All Departments</option>
            <!-- Populated via JS -->
          </select>
        </div>
      </div>

      <!-- Events Grid -->
      <div class="row" id="events-grid">
        <!-- Populated via JS -->
      </div>
    </div>

    <!-- Event Modal -->
    <div class="modal fade" id="eventModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title" id="modalTitle">Event Title</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <img
              src=""
              id="modalImage"
              class="img-fluid rounded mb-3 w-100"
              style="max-height: 300px; object-fit: cover"
            />
            <div class="row mb-2">
              <div class="col-md-6">
                <strong
                  ><i class="fa-regular fa-calendar me-2"></i>Date:</strong
                >
                <span id="modalDate"></span>
              </div>
              <div class="col-md-6">
                <strong><i class="fa-regular fa-clock me-2"></i>Time:</strong>
                <span id="modalTime"></span>
              </div>
            </div>
            <p>
              <strong
                ><i class="fa-solid fa-location-dot me-2"></i>Venue:</strong
              >
              <span id="modalVenue"></span>
            </p>
            <hr />
            <p id="modalDesc"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-success"
              data-bs-dismiss="modal"
            >
              Register / RSVP
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      const grid = document.getElementById("events-grid");
      const deptFilter = document.getElementById("dept-filter");

      // Departments
      const departments = [
          {id: 'CCS', name: 'College of Computer Studies'},
          {id: 'CBA', name: 'College of Business Administration'},
          {id: 'CAS', name: 'College of Arts and Sciences'}
      ];

      departments.forEach((dept) => {
            const option = document.createElement("option");
            option.value = dept.id;
            option.textContent = dept.name;
            deptFilter.appendChild(option);
      });

      let allEvents = [];

      async function fetchEvents() {
          try {
              allEvents = await API.getEvents();
              renderEvents(deptFilter.value);
          } catch (err) {
              console.error(err);
              showToast("Failed to load events", "error");
          }
      }

      function renderEvents(filterDept = "ALL") {
        grid.innerHTML = "";
        let events = allEvents;

        if (filterDept !== "ALL") {
          events = events.filter(
            (e) => e.department === filterDept || e.department === "ALL"
          );
        }

        const user = Auth.getCurrentUser();

        if (events.length === 0) {
            grid.innerHTML = '<div class="col-12 text-center mt-5"><p class="text-muted">No events found.</p></div>';
            return;
        }

        events.forEach((event) => {
          const isRegistered = event.attendees && event.attendees.includes(user._id);

          // Check Expiry
          const eventDateStr = event.date; // Assuming String from API
          const eventTimeStr = event.time || '23:59';
          const eventDateTime = new Date(`${eventDateStr}T${eventTimeStr}`);
          const isEnded = new Date() > eventDateTime;

          const btnClass = isEnded ? "btn-secondary" : (isRegistered ? "btn-secondary" : "btn-outline-success");
          const btnText = isEnded ? "Event Ended" : (isRegistered ? "Registered" : "View Details");

          const venue = event.location || "TBA";
          const time = event.time || "";

          const col = document.createElement("div");
          col.className = "col-md-4 mb-4";
          col.innerHTML = `
                    <div class="card h-100">
                        <img src="${event.image || 'https://via.placeholder.com/300'}" class="card-img-top" alt="${
            event.title
          }" style="height: 200px; object-fit: cover;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${event.title}</h5>
                            <p class="card-text text-muted small mb-2">
                                <i class="fa-regular fa-calendar"></i> ${
                                  event.date
                                } ${time ? '| ' + time : ''} <br>
                                ${event.department}
                            </p>
                            <p class="card-text flex-grow-1">${event.description.substring(
                              0,
                              80
                            )}...</p>
                            <button class="btn ${btnClass} w-100 mt-auto" onclick="openEventModal('${
            event._id
          }')">${btnText}</button>
                        </div>
                    </div>
                `;
          grid.appendChild(col);
        });
      }

      let currentEventId = null;

      window.openEventModal = function(id) {
        const event = allEvents.find((e) => e._id === id);
        if (!event) return;
        currentEventId = id;
        const user = Auth.getCurrentUser();

        document.getElementById("modalTitle").textContent = event.title;
        document.getElementById("modalImage").src = event.image || 'https://via.placeholder.com/300';
        document.getElementById("modalDate").textContent = event.date;
        document.getElementById("modalTime").textContent = event.time || '';
        document.getElementById("modalVenue").textContent = event.location;
        document.getElementById("modalDesc").textContent = event.description;

        // Update Modal Button State
        const modalBtn = document.querySelector("#eventModal .btn-success");
        const isRegistered = event.attendees && event.attendees.includes(user._id);

        const eventDateStr = event.date;
        const eventTimeStr = event.time || '23:59';
        const eventDateTime = new Date(`${eventDateStr}T${eventTimeStr}`);
        const isEnded = new Date() > eventDateTime;

        if (isEnded) {
            modalBtn.textContent = "Event Ended";
            modalBtn.disabled = true;
            modalBtn.onclick = null;
            modalBtn.classList.remove('btn-success');
            modalBtn.classList.add('btn-secondary');
        } else if (isRegistered) {
          modalBtn.textContent = "Already Registered";
          modalBtn.disabled = true;
          modalBtn.onclick = null;
          modalBtn.classList.remove('btn-success');
          modalBtn.classList.add('btn-secondary');
        } else {
          modalBtn.textContent = "Register / RSVP";
          modalBtn.disabled = false;
          modalBtn.onclick = handleRSVP;
          modalBtn.classList.remove('btn-secondary');
          modalBtn.classList.add('btn-success');
        }

        new bootstrap.Modal(document.getElementById("eventModal")).show();
      }

      async function handleRSVP() {
        if (currentEventId) {
          try {
              await API.rsvpEvent(currentEventId);
              showToast("Successfully registered for event!", "success");
              await fetchEvents(); // Reload to update UI
          } catch (err) {
              showToast(err.message, "error");
          }
        }
      }

      deptFilter.addEventListener("change", (e) =>
        renderEvents(e.target.value)
      );

      // Initial Render
      document.addEventListener('DOMContentLoaded', fetchEvents);
    </script>
  </body>
</html>
