    <div class="container py-4">
      <h2 class="mb-4 text-success">
        <i class="fa-solid fa-shirt me-2"></i>Merchandise Store
      </h2>

      <div class="row" id="merch-grid">
        <!-- Populated via JS -->
      </div>
    </div>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      const grid = document.getElementById("merch-grid");
      const user = Auth.getCurrentUser();

      let allMerch = [];

      async function fetchMerch() {
          try {
              allMerch = await API.getMerch();
              renderMerch(allMerch);
          } catch (err) {
              showToast("Failed to load merch", "error");
          }
      }

      function renderMerch(merchList) {
        grid.innerHTML = "";
        if (merchList.length === 0) {
             grid.innerHTML = '<div class="col-12 text-center"><p class="text-muted">No merchandise available.</p></div>';
             return;
        }

        merchList.forEach((item) => {
            const col = document.createElement("div");
            col.className = "col-md-3 col-sm-6 mb-4";

            const isMyDept = user.department && item.department === user.department;
            const badge = isMyDept
            ? '<span class="position-absolute top-0 end-0 badge bg-warning text-dark m-2">For You</span>'
            : "";

            col.innerHTML = `
                    <div class="card h-100 position-relative">
                        ${badge}
                        <img src="${item.image || 'https://via.placeholder.com/300'}" class="card-img-top" alt="${
            item.name
            }" style="height: 250px; object-fit: cover;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fs-6">${item.name}</h5>
                            <p class="text-success fw-bold mb-1">${formatCurrency(
                            item.price
                            )}</p>
                            <p class="small text-muted mb-3">${item.department || 'General'}</p>
                            <button class="btn btn-primary w-100 mt-auto" onclick="addToCart('${
                            item._id
                            }')">
                                <i class="fa-solid fa-cart-plus me-1"></i> Add to Cart
                            </button>
                        </div>
                    </div>
                `;
            grid.appendChild(col);
        });
      }

      window.addToCart = function(id) {
        const item = allMerch.find((i) => i._id === id);
        if (item) {
          const cartItem = { ...item, id: item._id };
          Cart.addItem(cartItem);
          showToast(`Added ${item.name} to cart!`, "success");
        }
      }

      fetchMerch();
    </script>
  </body>
</html>
