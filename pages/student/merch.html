<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="shortcut icon"
      href="/assets/uc-central-logo.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC-Central</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Dashboard</span></a>
                <a class="nav-link" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link active" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch Store</span></a>
                <a class="nav-link" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i> <span>Cart</span> <span id="cart-badge" class="badge bg-danger ms-auto d-none">0</span></a>
                <a class="nav-link" href="profile.html"><i class="fa-solid fa-user"></i> <span>Profile</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block" id="nav-user-name">Student</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
              <h2 class="mb-4 text-success">
                <i class="fa-solid fa-shirt me-2"></i>Merchandise Store
              </h2>

              <div class="row" id="merch-grid">
                <!-- Populated via JS -->
              </div>
            </div>
        </div>
    </div>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      const grid = document.getElementById("merch-grid");
      const user = Auth.getCurrentUser();

      let allMerch = [];

      async function fetchMerch() {
          try {
              allMerch = await API.getMerch();
              renderMerch(allMerch);
          } catch (err) {
              showToast("Failed to load merch", "error");
          }
      }

      function renderMerch(merchList) {
        grid.innerHTML = "";
        if (merchList.length === 0) {
             grid.innerHTML = '<div class="col-12 text-center"><p class="text-muted">No merchandise available.</p></div>';
             return;
        }

        merchList.forEach((item) => {
            const col = document.createElement("div");
            col.className = "col-md-3 col-sm-6 mb-4";

            const isMyDept = user.department && item.department === user.department;
            const badge = isMyDept
            ? '<span class="position-absolute top-0 end-0 badge bg-warning text-dark m-2">For You</span>'
            : "";

            const isOutOfStock = item.stock <= 0;
            const stockDisplay = isOutOfStock
                ? '<span class="text-danger small fw-bold">Out of Stock</span>'
                : `<span class="text-muted small">Stock: ${item.stock}</span>`;

            col.innerHTML = `
                    <div class="card h-100 position-relative">
                        ${badge}
                        <img src="${item.image || 'https://via.placeholder.com/300'}" class="card-img-top" alt="${
            item.name
            }" style="height: 250px; object-fit: cover; opacity: ${isOutOfStock ? '0.6' : '1'};">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fs-6">${item.name}</h5>
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="text-success fw-bold">${formatCurrency(item.price)}</span>
                                ${stockDisplay}
                            </div>
                            <p class="small text-muted mb-3">${item.department || 'General'}</p>
                            <button class="btn btn-primary w-100 mt-auto" onclick="addToCart('${
                            item._id
                            }')" ${isOutOfStock ? 'disabled' : ''}>
                                <i class="fa-solid fa-cart-plus me-1"></i> ${isOutOfStock ? 'Out of Stock' : 'Add to Cart'}
                            </button>
                        </div>
                    </div>
                `;
            grid.appendChild(col);
        });
      }

      window.addToCart = function(id) {
        const item = allMerch.find((i) => i._id === id);
        if (item) {
          const cartItem = { ...item, id: item._id };
          Cart.addItem(cartItem);
          showToast(`Added ${item.name} to cart!`, "success");
        }
      }

      fetchMerch();
    </script>
  </body>
</html>
