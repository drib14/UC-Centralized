<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merch Store - UC-Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-school me-2"></i>UC-Central</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="events.html">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="merch.html">Merch Store</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <a class="nav-link position-relative" href="cart.html">
                            <i class="fa-solid fa-cart-shopping fa-lg"></i>
                            <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                                0
                            </span>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <span id="nav-user-name">Student</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logout-btn">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4 text-success"><i class="fa-solid fa-shirt me-2"></i>Merchandise Store</h2>

        <div class="row" id="merch-grid">
            <!-- Populated via JS -->
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.requireLogin();

        const grid = document.getElementById('merch-grid');
        const user = Auth.getCurrentUser();

        // Simple recommendation logic: Show User's Dept merch first, or highlight it
        // For now, just listing all

        window.MockData.merch.forEach(item => {
            const col = document.createElement('div');
            col.className = 'col-md-3 col-sm-6 mb-4';

            const isMyDept = item.department === user.department;
            const badge = isMyDept ? '<span class="position-absolute top-0 end-0 badge bg-warning text-dark m-2">For You</span>' : '';

            col.innerHTML = `
                <div class="card h-100 position-relative">
                    ${badge}
                    <img src="${item.image}" class="card-img-top" alt="${item.name}" style="height: 250px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fs-6">${item.name}</h5>
                        <p class="text-success fw-bold mb-1">${formatCurrency(item.price)}</p>
                        <p class="small text-muted mb-3">${item.department}</p>
                        <button class="btn btn-primary w-100 mt-auto" onclick="addToCart(${item.id})">
                            <i class="fa-solid fa-cart-plus me-1"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `;
            grid.appendChild(col);
        });

        function addToCart(id) {
            const item = window.MockData.merch.find(i => i.id === id);
            if (item) {
                Cart.addItem(item);
                showToast(`Added ${item.name} to cart!`, 'success');
            }
        }
    </script>
</body>
</html>
