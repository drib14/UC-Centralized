<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="shortcut icon"
      href="/assets/uc-central-logo.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <title>UC-Central</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link active" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Dashboard</span></a>
                <a class="nav-link" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch Store</span></a>
                <a class="nav-link" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i> <span>Cart</span> <span id="cart-badge" class="badge bg-danger ms-auto d-none">0</span></a>
                <a class="nav-link" href="profile.html"><i class="fa-solid fa-user"></i> <span>Profile</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block" id="nav-user-name">Student</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
              <!-- Welcome Section -->
              <div class="row mb-4">
                <div class="col-12">
                  <div
                    class="p-5 mb-4 bg-light rounded-3 border-start border-5 border-success"
                  >
                    <div class="container-fluid py-2">
                      <h1 class="display-5 fw-bold text-success">Welcome back!</h1>
                      <p class="col-md-8 fs-4">
                        Check out the latest announcements and upcoming events for your
                        department.
                      </p>
                      <a href="events.html" class="btn btn-primary btn-lg" type="button"
                        >Browse Events</a
                      >
                    </div>
                  </div>
                </div>
              </div>

              <div class="row">
                <!-- Announcements Feed -->
                <div class="col-lg-8">
                  <h3 class="mb-3 text-success">
                    <i class="fa-solid fa-bullhorn me-2"></i>Announcements
                  </h3>
                  <div id="announcements-feed">
                    <!-- JS Populated -->
                    <div class="text-center my-5">
                        <div class="spinner-border text-success" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                  </div>
                </div>

                <!-- Upcoming Events Sidebar -->
                <div class="col-lg-4">
                  <h3 class="mb-3 text-success">
                    <i class="fa-solid fa-calendar me-2"></i>Upcoming
                  </h3>
                  <div id="upcoming-events-sidebar">
                    <!-- Populated by JS -->
                     <div class="text-center my-5">
                        <div class="spinner-border text-success" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      const feed = document.getElementById("announcements-feed");
      const sidebar = document.getElementById("upcoming-events-sidebar");

      async function loadDashboard() {
          try {
              // Announcements
              const announcements = await API.getAnnouncements();
              feed.innerHTML = '';
              if (announcements.length === 0) {
                feed.innerHTML = '<p class="text-muted">No announcements yet.</p>';
              } else {
                announcements.forEach((ann) => {
                    // Format date roughly
                    const date = new Date(ann.createdAt || ann.date).toLocaleDateString();
                    const card = `
                            <div class="card mb-3">
                                <div class="card-body">
                                    <h5 class="card-title">${ann.title}</h5>
                                    <h6 class="card-subtitle mb-2 text-muted">Posted on ${
                                      date
                                    } by ${
                    ann.author || "Admin"
                  } <span class="badge bg-light text-dark border ms-2">${
                    ann.department
                  }</span></h6>
                                    <p class="card-text">${ann.message}</p>
                                </div>
                            </div>
                        `;
                    feed.innerHTML += card;
                });
              }

              // Events
              const events = await API.getEvents();
              const now = new Date();

              const upcomingEvents = events.filter(event => {
                  const eventDateStr = event.date;
                  const eventTimeStr = event.time || '23:59';
                  const eventDateTime = new Date(`${eventDateStr}T${eventTimeStr}`);
                  return eventDateTime >= now;
              });

              const recentEvents = upcomingEvents.slice(0, 3);
              sidebar.innerHTML = '';
              if (recentEvents.length === 0) {
                  sidebar.innerHTML = '<p class="text-muted">No upcoming events.</p>';
              }
              recentEvents.forEach((event) => {
                const venue = event.location || 'TBA';
                const card = `
                        <div class="card mb-3">
                            <div class="card-body">
                                <h6 class="fw-bold">${event.title}</h6>
                                <p class="small text-muted mb-1"><i class="fa-regular fa-clock me-1"></i>${event.date}</p>
                                <p class="small mb-0">${venue}</p>
                                <a href="events.html" class="btn btn-sm btn-outline-success mt-2 w-100">View Details</a>
                            </div>
                        </div>
                    `;
                sidebar.innerHTML += card;
              });

          } catch(e) {
              console.error(e);
          }
      }

      loadDashboard();
    </script>
  </body>
</html>
