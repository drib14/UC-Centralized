</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-school me-2"></i>UC-Central</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="events.html">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="merch.html">Merch Store</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="messages.html">Messages</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center">
                     <li class="nav-item me-3">
                        <a class="nav-link position-relative" href="notifications.html">
                            <i class="fa-solid fa-bell fa-lg"></i>
                            <span class="position-absolute top-10 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                                <span class="visually-hidden">New alerts</span>
                            </span>
                        </a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link position-relative" href="cart.html">
                            <i class="fa-solid fa-cart-shopping fa-lg"></i>
                            <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                                0
                            </span>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fa-solid fa-user-circle me-1"></i> <span id="nav-user-name">Student</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logout-btn">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-4">

        <!-- Welcome Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="p-5 mb-4 bg-light rounded-3 border-start border-5 border-success">
                    <div class="container-fluid py-2">
                        <h1 class="display-5 fw-bold text-success">Welcome back!</h1>
                        <p class="col-md-8 fs-4">Check out the latest announcements and upcoming events for your department.</p>
                        <a href="events.html" class="btn btn-primary btn-lg" type="button">Browse Events</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Announcements Feed -->
            <div class="col-lg-8">
                <h3 class="mb-3 text-success"><i class="fa-solid fa-bullhorn me-2"></i>Announcements</h3>
                <div id="announcements-feed">
                    <!-- JS Populated -->
                </div>
            </div>

            <!-- Upcoming Events Sidebar -->
            <div class="col-lg-4">
                <h3 class="mb-3 text-success"><i class="fa-solid fa-calendar me-2"></i>Upcoming</h3>
                <div id="upcoming-events-sidebar">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/db.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.requireLogin();

        // Populate Announcements
        const feed = document.getElementById('announcements-feed');
        const announcements = DB.getAnnouncements();

        if (announcements.length === 0) {
            feed.innerHTML = '<p class="text-muted">No announcements yet.</p>';
        } else {
            announcements.forEach(ann => {
                const card = `
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5 class="card-title">${ann.title}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">Posted on ${ann.date} by ${ann.author || 'Admin'} <span class="badge bg-light text-dark border ms-2">${ann.dept}</span></h6>
                            <p class="card-text">${ann.message}</p>
                        </div>
                    </div>
                `;
                feed.innerHTML += card;
            });
        }

        // Populate Sidebar with Events from DB
        const sidebar = document.getElementById('upcoming-events-sidebar');
        const events = DB.getEvents().slice(0, 3); // Top 3

        events.forEach(event => {
            const card = `
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 class="fw-bold">${event.title}</h6>
                        <p class="small text-muted mb-1"><i class="fa-regular fa-clock me-1"></i>${event.date}</p>
                        <p class="small mb-0">${event.venue}</p>
                        <a href="events.html" class="btn btn-sm btn-outline-success mt-2 w-100">View Details</a>
                    </div>
                </div>
            `;
            sidebar.innerHTML += card;
        });
    </script>
</body>
</html>
