<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="shortcut icon"
      href="/assets/uc-central-logo.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <title>UC-Central</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Dashboard</span></a>
                <a class="nav-link" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch Store</span></a>
                <a class="nav-link active" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i> <span>Cart</span> <span id="cart-badge" class="badge bg-danger ms-auto d-none">0</span></a>
                <a class="nav-link" href="profile.html"><i class="fa-solid fa-user"></i> <span>Profile</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block" id="nav-user-name">Student</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
              <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-success">
                  <i class="fa-regular fa-envelope me-2"></i>My Inquiries
                </h2>
                <button
                  class="btn btn-success"
                  data-bs-toggle="modal"
                  data-bs-target="#msgModal"
                >
                  <i class="fa-solid fa-pen"></i> New Message
                </button>
              </div>

              <div class="list-group" id="msg-list">
                <!-- JS populated -->
              </div>
            </div>
        </div>
    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="msgModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">Send Inquiry</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="msg-form">
              <div class="mb-3">
                <label class="form-label">To Department</label>
                <select id="msg-dept" class="form-select">
                  <option value="ADMIN">Admin / Help Desk</option>
                  <!-- JS Populated -->
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Subject</label>
                <input
                  type="text"
                  id="msg-subj"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea
                  id="msg-body"
                  class="form-control"
                  rows="4"
                  required
                ></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="sendMessage()"
            >
              Send
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      Auth.checkSession();
      const currentUser = Auth.getCurrentUser();

      // Departments
      const deptSelect = document.getElementById("msg-dept");
      const depts = [
          {id: 'CCS', name: 'College of Computer Studies'},
          {id: 'CBA', name: 'College of Business Administration'},
          {id: 'CAS', name: 'College of Arts and Sciences'}
      ];
      depts.forEach((d) => {
          const opt = document.createElement("option");
          opt.value = d.id;
          opt.textContent = d.name;
          deptSelect.appendChild(opt);
      });

      // Local storage for messages
      const MESSAGES_KEY = 'ucc_messages_local';
      function getLocalMessages() {
          return JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
      }
      function addLocalMessage(msg) {
          const list = getLocalMessages();
          list.push(msg);
          localStorage.setItem(MESSAGES_KEY, JSON.stringify(list));
      }

      function renderMessages() {
        const list = document.getElementById("msg-list");
        list.innerHTML = "";
        // Filter messages for current user
        const messages = getLocalMessages().filter(
          (m) => m.studentId === currentUser.studentId
        );

        if (messages.length === 0) {
          list.innerHTML =
            '<p class="text-muted text-center py-5">No messages sent yet.</p>';
          return;
        }

        messages.forEach((msg) => {
          const item = document.createElement("div");
          item.className = "list-group-item";
          item.innerHTML = `
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">${msg.subject}</h5>
                        <small class="text-muted">${new Date(
                          msg.date
                        ).toLocaleDateString()}</small>
                    </div>
                    <p class="mb-1">${msg.body}</p>
                    <small class="text-success">To: ${msg.toDept}</small>
                `;
          list.appendChild(item);
        });
      }

      window.sendMessage = function() {
        const toDept = document.getElementById("msg-dept").value;
        const subject = document.getElementById("msg-subj").value;
        const body = document.getElementById("msg-body").value;

        if (!subject || !body) {
          showToast("Please fill all fields", "error");
          return;
        }

        addLocalMessage({
          studentId: currentUser.studentId,
          toDept,
          subject,
          body,
          date: new Date()
        });

        showToast("Message sent successfully!", "success");
        bootstrap.Modal.getInstance(document.getElementById("msgModal")).hide();
        document.getElementById("msg-form").reset();
        renderMessages();
      }

      renderMessages();
    </script>
  </body>
</html>
