    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-success">
          <i class="fa-regular fa-envelope me-2"></i>My Inquiries
        </h2>
        <button
          class="btn btn-success"
          data-bs-toggle="modal"
          data-bs-target="#msgModal"
        >
          <i class="fa-solid fa-pen"></i> New Message
        </button>
      </div>

      <div class="list-group" id="msg-list">
        <!-- JS populated -->
      </div>
    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="msgModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">Send Inquiry</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="msg-form">
              <div class="mb-3">
                <label class="form-label">To Department</label>
                <select id="msg-dept" class="form-select">
                  <option value="ADMIN">Admin / Help Desk</option>
                  <!-- JS Populated -->
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Subject</label>
                <input
                  type="text"
                  id="msg-subj"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea
                  id="msg-body"
                  class="form-control"
                  rows="4"
                  required
                ></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="sendMessage()"
            >
              Send
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      Auth.checkSession();
      const currentUser = Auth.getCurrentUser();

      // Departments
      const deptSelect = document.getElementById("msg-dept");
      const depts = [
          {id: 'CCS', name: 'College of Computer Studies'},
          {id: 'CBA', name: 'College of Business Administration'},
          {id: 'CAS', name: 'College of Arts and Sciences'}
      ];
      depts.forEach((d) => {
          const opt = document.createElement("option");
          opt.value = d.id;
          opt.textContent = d.name;
          deptSelect.appendChild(opt);
      });

      // Local storage for messages
      const MESSAGES_KEY = 'ucc_messages_local';
      function getLocalMessages() {
          return JSON.parse(localStorage.getItem(MESSAGES_KEY) || '[]');
      }
      function addLocalMessage(msg) {
          const list = getLocalMessages();
          list.push(msg);
          localStorage.setItem(MESSAGES_KEY, JSON.stringify(list));
      }

      function renderMessages() {
        const list = document.getElementById("msg-list");
        list.innerHTML = "";
        // Filter messages for current user
        const messages = getLocalMessages().filter(
          (m) => m.studentId === currentUser.studentId
        );

        if (messages.length === 0) {
          list.innerHTML =
            '<p class="text-muted text-center py-5">No messages sent yet.</p>';
          return;
        }

        messages.forEach((msg) => {
          const item = document.createElement("div");
          item.className = "list-group-item";
          item.innerHTML = `
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">${msg.subject}</h5>
                        <small class="text-muted">${new Date(
                          msg.date
                        ).toLocaleDateString()}</small>
                    </div>
                    <p class="mb-1">${msg.body}</p>
                    <small class="text-success">To: ${msg.toDept}</small>
                `;
          list.appendChild(item);
        });
      }

      window.sendMessage = function() {
        const toDept = document.getElementById("msg-dept").value;
        const subject = document.getElementById("msg-subj").value;
        const body = document.getElementById("msg-body").value;

        if (!subject || !body) {
          showToast("Please fill all fields", "error");
          return;
        }

        addLocalMessage({
          studentId: currentUser.studentId,
          toDept,
          subject,
          body,
          date: new Date()
        });

        showToast("Message sent successfully!", "success");
        bootstrap.Modal.getInstance(document.getElementById("msgModal")).hide();
        document.getElementById("msg-form").reset();
        renderMessages();
      }

      renderMessages();
    </script>
  </body>
</html>
