<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="shortcut icon"
      href="/assets/uc-central-logo.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC-Central</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Dashboard</span></a>
                <a class="nav-link" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch Store</span></a>
                <a class="nav-link" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link active" href="cart.html"><i class="fa-solid fa-cart-shopping"></i> <span>Cart</span> <span id="cart-badge" class="badge bg-danger ms-auto d-none">0</span></a>
                <a class="nav-link" href="profile.html"><i class="fa-solid fa-user"></i> <span>Profile</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block" id="nav-user-name">Student</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
              <h2 class="mb-4 text-success">
                <i class="fa-solid fa-cart-shopping me-2"></i>Your Cart
              </h2>

              <div class="row">
                <div class="col-lg-8">
                  <div class="card mb-4">
                    <div class="card-body" id="cart-items-container">
                      <!-- Populated via JS -->
                      <p class="text-center text-muted py-5">Your cart is empty.</p>
                    </div>
                  </div>
                </div>
                <div class="col-lg-4">
                  <div class="card">
                    <div class="card-header">Order Summary</div>
                    <div class="card-body">
                      <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">PHP 0.00</span>
                      </div>
                      <div class="d-flex justify-content-between mb-3">
                        <span>Shipping (Pickup)</span>
                        <span>Free</span>
                      </div>
                      <hr />
                      <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total</span>
                        <span id="cart-total">PHP 0.00</span>
                      </div>
                      <button
                        class="btn btn-success w-100 mt-4"
                        id="checkout-btn"
                        disabled
                      >
                        Proceed to Checkout
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmOrderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Confirm Order</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to place this order?</p>
                    <div class="d-flex justify-content-between fw-bold fs-5 border-top pt-2">
                        <span>Total:</span>
                        <span id="modal-total-price"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="processCheckout()">Place Order</button>
                </div>
            </div>
        </div>
    </div>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      function renderCart() {
        const container = document.getElementById("cart-items-container");
        const items = Cart.getItems();

        if (items.length === 0) {
          container.innerHTML =
            '<p class="text-center text-muted py-5">Your cart is empty.</p>';
          document.getElementById("checkout-btn").disabled = true;
          updateTotals(0);
          return;
        }

        document.getElementById("checkout-btn").disabled = false;
        container.innerHTML = "";

        items.forEach((item) => {
          const row = document.createElement("div");
          row.className = "d-flex align-items-center mb-3 pb-3 border-bottom";
          row.innerHTML = `
                    <img src="${
                      item.image || 'https://via.placeholder.com/80'
                    }" class="rounded me-3" style="width: 80px; height: 80px; object-fit: cover;">
                    <div class="flex-grow-1">
                        <h6 class="mb-0">${item.name}</h6>
                        <small class="text-muted">${item.category || item.description || 'Item'}</small>
                    </div>
                    <div class="text-end me-4 d-flex align-items-center">
                        <div class="fw-bold me-3">${formatCurrency(item.price)}</div>
                        <div class="btn-group btn-group-sm me-2">
                            <button class="btn btn-outline-secondary" onclick="updateQty('${item.id}', ${item.quantity - 1})">-</button>
                            <span class="btn btn-light disabled text-dark border-secondary" style="width: 40px;">${item.quantity}</span>
                            <button class="btn btn-outline-secondary" onclick="updateQty('${item.id}', ${item.quantity + 1})">+</button>
                        </div>
                    </div>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeFromCart('${
                      item.id
                    }')">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
          container.appendChild(row);
        });

        updateTotals(Cart.getTotal());
      }

      function updateTotals(total) {
        const formatted = formatCurrency(total);
        document.getElementById("cart-subtotal").textContent = formatted;
        document.getElementById("cart-total").textContent = formatted;
      }

      window.removeFromCart = function(id) {
        Cart.removeItem(id);
        renderCart();
      }

      window.updateQty = function(id, qty) {
        Cart.updateQuantity(id, qty);
        renderCart();
      }

      document.getElementById("checkout-btn").addEventListener("click", async () => {
          const total = Cart.getTotal();
          document.getElementById('modal-total-price').textContent = formatCurrency(total);
          new bootstrap.Modal(document.getElementById('confirmOrderModal')).show();
      });

      window.processCheckout = async function() {
          const items = Cart.getItems();
          const total = Cart.getTotal();

          const orderItems = items.map(i => ({
              merch: i.id,
              quantity: i.quantity
          }));

          const orderData = {
            items: orderItems,
            totalPrice: total
          };

          try {
              await API.createOrder(orderData);
              Cart.clear();
              renderCart();

              // Close modal
              const modalEl = document.getElementById('confirmOrderModal');
              bootstrap.Modal.getInstance(modalEl).hide();

              showToast("Order placed successfully!", "success");
          } catch (e) {
              showToast("Order failed: " + e.message, "error");
          }
      }

      // Initial Render
      renderCart();
    </script>
  </body>
</html>
