<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="shortcut icon"
      href="/assets/uc-central-logo.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <title>UC-Central</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body>

    <div id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/uc-central-logo.png" class="logo-img" alt="Logo">
                <span class="sidebar-brand-text">UC-Central</span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-table-columns"></i> <span>Dashboard</span></a>
                <a class="nav-link" href="events.html"><i class="fa-solid fa-calendar-days"></i> <span>Events</span></a>
                <a class="nav-link" href="merch.html"><i class="fa-solid fa-shirt"></i> <span>Merch Store</span></a>
                <a class="nav-link" href="messages.html"><i class="fa-solid fa-envelope"></i> <span>Messages</span></a>
                <a class="nav-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i> <span>Cart</span> <span id="cart-badge" class="badge bg-danger ms-auto d-none">0</span></a>
                <a class="nav-link active" href="profile.html"><i class="fa-solid fa-user"></i> <span>Profile</span></a>
            </nav>
            <div class="sidebar-footer">
                <a class="nav-link text-danger" href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </div>
        </div>

        <!-- Content -->
        <div id="page-content-wrapper">
            <div class="topbar">
                <div class="d-flex align-items-center">
                    <span class="me-2 fw-bold text-primary d-none d-md-block" id="nav-user-name">Student</span>
                    <img src="../../assets/uc-central-logo.png" class="rounded-3 border border-2 border-primary" width="40" height="40">
                </div>
            </div>

            <div class="container-fluid">
              <div class="row justify-content-center">
                <div class="col-md-8">
                  <div class="card">
                    <div class="card-header bg-success text-white">
                      <h4 class="mb-0">
                        <i class="fa-solid fa-user me-2"></i>My Profile
                      </h4>
                    </div>
                    <div class="card-body text-center py-4">
                      <img
                        src=""
                        id="profile-img-display"
                        class="rounded-circle mb-3 border border-4 border-success"
                        width="120"
                        height="120"
                        style="object-fit: cover; display: none;"
                      />
                      <h3 id="p-name" class="fw-bold">Student Name</h3>
                      <p id="p-id" class="text-muted mb-4">ID: 12345678</p>

                      <div class="row text-start g-3 justify-content-center">
                        <div class="col-md-8">
                          <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                              <strong>Department:</strong>
                              <span id="p-dept" class="float-end">BSIT</span>
                            </li>
                            <li class="list-group-item">
                              <strong>Program:</strong>
                              <span id="p-prog" class="float-end">IT</span>
                            </li>
                            <li class="list-group-item">
                              <strong>Year Level:</strong>
                              <span id="p-year" class="float-end">3</span>
                            </li>
                            <li class="list-group-item">
                              <strong>Role:</strong>
                              <span
                                id="p-role"
                                class="float-end text-uppercase badge bg-secondary"
                                >Student</span
                              >
                            </li>
                          </ul>
                        </div>
                      </div>
                    </div>
                    <div class="card-footer text-center">
                      <button
                        class="btn btn-outline-secondary btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#editProfileModal"
                      >
                        Edit Profile
                      </button>
                    </div>
                  </div>

                  <!-- Activity Tabs -->
                  <div class="mt-4">
                        <ul class="nav nav-tabs" id="profileTabs" role="tablist">
                            <li class="nav-item">
                                <button class="nav-link active text-success" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders" type="button">My Orders</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link text-success" id="events-tab" data-bs-toggle="tab" data-bs-target="#events" type="button">My Events (RSVP)</button>
                            </li>
                        </ul>
                        <div class="tab-content p-3 border border-top-0 bg-white rounded-bottom shadow-sm">
                            <div class="tab-pane fade show active" id="orders">
                                <div id="orders-list" class="list-group list-group-flush">
                                     <div class="text-center py-3"><div class="spinner-border text-success small"></div></div>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="events">
                                <div id="events-list" class="list-group list-group-flush">
                                     <div class="text-center py-3"><div class="spinner-border text-success small"></div></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
              </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">Edit Profile</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="edit-profile-form">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">First Name</label>
                  <input
                    type="text"
                    id="e-fname"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Last Name</label>
                  <input
                    type="text"
                    id="e-lname"
                    class="form-control"
                    required
                  />
                </div>
              </div>
              <!-- Disabled fields -->
              <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" id="e-id" class="form-control" disabled />
              </div>
              <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" id="e-dept" class="form-control" disabled />
              </div>
              <hr />
              <div class="mb-3">
                <label class="form-label">New Password (Optional)</label>
                <input
                  type="password"
                  id="e-pass"
                  class="form-control"
                  placeholder="Leave blank to keep current"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="saveProfile()"
            >
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      Auth.checkSession();
      let user = Auth.getCurrentUser();
      const profileImgEl = document.getElementById('profile-img-display');

      function renderProfile() {
        if (user) {
          const displayName = (user.firstName && user.lastName) ? `${user.firstName} ${user.lastName}` : (user.name || 'Student');
          document.getElementById(
            "p-name"
          ).textContent = displayName;
          document.getElementById("p-id").textContent = `ID: ${user.studentId}`;
          document.getElementById("p-dept").textContent = user.department || 'N/A';
          document.getElementById("p-prog").textContent = user.program || 'N/A';
          document.getElementById("p-year").textContent = user.year || 'N/A';
          document.getElementById("p-role").textContent = user.role;

          // Initials Logic
          if (user.profileImage) {
              profileImgEl.src = user.profileImage;
              profileImgEl.style.display = 'inline-block';
              const ph = document.getElementById('profile-placeholder');
              if (ph) ph.style.display = 'none';
          } else {
              profileImgEl.style.display = 'none';
              const fInitial = user.firstName ? user.firstName.charAt(0) : (user.name ? user.name.charAt(0) : 'S');
              const lInitial = user.lastName ? user.lastName.charAt(0) : (user.name && user.name.includes(' ') ? user.name.split(' ').pop().charAt(0) : '');
              const initials = (fInitial + lInitial).toUpperCase();

              let placeholder = document.getElementById('profile-placeholder');
              if (!placeholder) {
                  placeholder = document.createElement('div');
                  placeholder.id = 'profile-placeholder';
                  placeholder.className = 'rounded-circle mb-3 border border-4 border-success d-flex align-items-center justify-content-center bg-light text-success fw-bold mx-auto';
                  placeholder.style.width = '120px';
                  placeholder.style.height = '120px';
                  placeholder.style.fontSize = '40px';
                  profileImgEl.parentNode.insertBefore(placeholder, profileImgEl);
              }
              placeholder.textContent = initials;
              placeholder.style.display = 'flex';
          }

          // Pre-fill Edit Form
          document.getElementById("e-fname").value = user.firstName || (user.name ? user.name.split(' ')[0] : '');
          document.getElementById("e-lname").value = user.lastName || (user.name && user.name.includes(' ') ? user.name.split(' ').pop() : '');
          document.getElementById("e-id").value = user.studentId;
          document.getElementById("e-dept").value = user.department || '';
        }
      }

      async function saveProfile() {
        const fname = document.getElementById("e-fname").value;
        const lname = document.getElementById("e-lname").value;
        const pass = document.getElementById("e-pass").value;

        if (!fname || !lname) {
          showToast("Name is required", "error");
          return;
        }

        const updateData = {
            firstName: fname,
            lastName: lname
        };
        if (pass) updateData.password = pass;

        try {
            const updatedUser = await API.updateProfile(updateData);
            localStorage.setItem(Auth.CURRENT_USER_KEY, JSON.stringify(updatedUser));
            user = updatedUser;
            renderProfile();
            showToast("Profile updated!", "success");
            bootstrap.Modal.getInstance(
                document.getElementById("editProfileModal")
            ).hide();
        } catch (e) {
            showToast(e.message, "error");
        }
      }

      async function loadActivity() {
          try {
              const orders = await API.getOrders();
              renderOrders(orders);

              const allEvents = await API.getEvents();
              // Filter events I RSVPd to
              const myEvents = allEvents.filter(e => e.attendees && e.attendees.includes(user._id));
              renderEvents(myEvents);
          } catch (e) {
              console.error(e);
          }
      }

      function renderOrders(orders) {
          const list = document.getElementById('orders-list');
          list.innerHTML = '';
          if(orders.length === 0) {
              list.innerHTML = '<p class="text-muted text-center my-3">No orders found.</p>';
              return;
          }
          orders.forEach(o => {
              const date = new Date(o.createdAt || o.orderDate).toLocaleDateString();
              const itemNames = o.items.map(i => i.merch ? i.merch.name : 'Unknown').join(', ');
              const statusBadge = getStatusBadge(o.status);

              const item = `
                <div class="list-group-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">Order #${o._id.slice(-6).toUpperCase()}</h6>
                            <small class="text-muted">${date} | ${itemNames}</small>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold">${formatCurrency(o.totalPrice)}</div>
                            ${statusBadge}
                        </div>
                    </div>
                </div>
              `;
              list.innerHTML += item;
          });
      }

      function renderEvents(events) {
          const list = document.getElementById('events-list');
          list.innerHTML = '';
          if(events.length === 0) {
              list.innerHTML = '<p class="text-muted text-center my-3">No RSVP\'d events.</p>';
              return;
          }
          events.forEach(e => {
               const date = new Date(e.date).toLocaleDateString();
               const item = `
                <div class="list-group-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">${e.title}</h6>
                            <small class="text-muted"><i class="fa-regular fa-calendar me-1"></i>${date} | ${e.location}</small>
                        </div>
                        <div>
                            <span class="badge bg-primary">Going</span>
                        </div>
                    </div>
                </div>
               `;
               list.innerHTML += item;
          });
      }

      function getStatusBadge(status) {
          const map = {
              'pending': 'bg-warning text-dark',
              'claimed': 'bg-success',
              'cancelled': 'bg-danger'
          };
          return `<span class="badge ${map[status] || 'bg-secondary'}">${status.toUpperCase()}</span>`;
      }

      renderProfile();
      loadActivity();
    </script>
  </body>
</html>
