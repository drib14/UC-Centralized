<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - UC-Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fa-solid fa-school me-2"></i>UC-Central</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="events.html">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="merch.html">Merch Store</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <a class="nav-link position-relative" href="cart.html">
                            <i class="fa-solid fa-cart-shopping fa-lg"></i>
                            <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                                0
                            </span>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <span id="nav-user-name">Student</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                            <li><a class="dropdown-item text-danger" href="#" id="logout-btn">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0"><i class="fa-solid fa-user me-2"></i>My Profile</h4>
                    </div>
                    <div class="card-body text-center py-4">
                        <img src="https://placehold.co/150x150?text=User" class="rounded-circle mb-3 border border-4 border-success" width="120">
                        <h3 id="p-name" class="fw-bold">Student Name</h3>
                        <p id="p-id" class="text-muted mb-4">ID: 12345678</p>

                        <div class="row text-start g-3 justify-content-center">
                            <div class="col-md-8">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item">
                                        <strong>Department:</strong> <span id="p-dept" class="float-end">BSIT</span>
                                    </li>
                                    <li class="list-group-item">
                                        <strong>Program:</strong> <span id="p-prog" class="float-end">IT</span>
                                    </li>
                                    <li class="list-group-item">
                                        <strong>Year Level:</strong> <span id="p-year" class="float-end">3</span>
                                    </li>
                                    <li class="list-group-item">
                                        <strong>Role:</strong> <span id="p-role" class="float-end text-uppercase badge bg-secondary">Student</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <button class="btn btn-outline-secondary btn-sm">Edit Profile (Mock)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.requireLogin();
        const user = Auth.getCurrentUser();

        if (user) {
            document.getElementById('p-name').textContent = `${user.firstName} ${user.lastName}`;
            document.getElementById('p-id').textContent = `ID: ${user.studentId}`;
            document.getElementById('p-dept').textContent = user.department;
            document.getElementById('p-prog').textContent = user.program;
            document.getElementById('p-year').textContent = user.year;
            document.getElementById('p-role').textContent = user.role;
        }
    </script>
</body>
</html>
