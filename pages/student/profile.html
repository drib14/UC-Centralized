<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="shortcut icon"
      href="/assets/uc-central-logo.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <title>UC-Central</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html"
          ><i class="fa-solid fa-school me-2"></i>UC-Central</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="events.html">Events</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="merch.html">Merch Store</a>
            </li>
          </ul>
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item me-3">
              <a class="nav-link position-relative" href="cart.html">
                <i class="fa-solid fa-cart-shopping fa-lg"></i>
                <span
                  id="cart-badge"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
                >
                  0
                </span>
              </a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle active"
                href="#"
                id="userDropdown"
                role="button"
                data-bs-toggle="dropdown"
              >
                <span id="nav-user-name">Student</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="profile.html">Profile</a>
                </li>
                <li>
                  <a class="dropdown-item text-danger" href="#" id="logout-btn"
                    >Logout</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-header bg-success text-white">
              <h4 class="mb-0">
                <i class="fa-solid fa-user me-2"></i>My Profile
              </h4>
            </div>
            <div class="card-body text-center py-4">
              <img
                src="https://placehold.co/150x150?text=User"
                class="rounded-circle mb-3 border border-4 border-success"
                width="120"
              />
              <h3 id="p-name" class="fw-bold">Student Name</h3>
              <p id="p-id" class="text-muted mb-4">ID: 12345678</p>

              <div class="row text-start g-3 justify-content-center">
                <div class="col-md-8">
                  <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                      <strong>Department:</strong>
                      <span id="p-dept" class="float-end">BSIT</span>
                    </li>
                    <li class="list-group-item">
                      <strong>Program:</strong>
                      <span id="p-prog" class="float-end">IT</span>
                    </li>
                    <li class="list-group-item">
                      <strong>Year Level:</strong>
                      <span id="p-year" class="float-end">3</span>
                    </li>
                    <li class="list-group-item">
                      <strong>Role:</strong>
                      <span
                        id="p-role"
                        class="float-end text-uppercase badge bg-secondary"
                        >Student</span
                      >
                    </li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="card-footer text-center">
              <button
                class="btn btn-outline-secondary btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#editProfileModal"
              >
                Edit Profile
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">Edit Profile</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="edit-profile-form">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">First Name</label>
                  <input
                    type="text"
                    id="e-fname"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Last Name</label>
                  <input
                    type="text"
                    id="e-lname"
                    class="form-control"
                    required
                  />
                </div>
              </div>
              <!-- Disabled fields -->
              <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" id="e-id" class="form-control" disabled />
              </div>
              <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" id="e-dept" class="form-control" disabled />
              </div>
              <hr />
              <div class="mb-3">
                <label class="form-label">New Password (Optional)</label>
                <input
                  type="password"
                  id="e-pass"
                  class="form-control"
                  placeholder="Leave blank to keep current"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="saveProfile()"
            >
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      Auth.requireLogin();
      let user = Auth.getCurrentUser();

      function renderProfile() {
        if (user) {
          document.getElementById(
            "p-name"
          ).textContent = `${user.firstName} ${user.lastName}`;
          document.getElementById("p-id").textContent = `ID: ${user.studentId}`;
          document.getElementById("p-dept").textContent = user.department;
          document.getElementById("p-prog").textContent = user.program;
          document.getElementById("p-year").textContent = user.year;
          document.getElementById("p-role").textContent = user.role;

          // Pre-fill Edit Form
          document.getElementById("e-fname").value = user.firstName;
          document.getElementById("e-lname").value = user.lastName;
          document.getElementById("e-id").value = user.studentId;
          document.getElementById("e-dept").value = user.department;
        }
      }

      function saveProfile() {
        const fname = document.getElementById("e-fname").value;
        const lname = document.getElementById("e-lname").value;
        const pass = document.getElementById("e-pass").value;

        if (!fname || !lname) {
          showToast("Name is required", "error");
          return;
        }

        // Update local object
        user.firstName = fname;
        user.lastName = lname;
        if (pass) user.password = pass; // In real app, re-hash. Here just raw.

        // Save to LocalStorage
        // Need to update the main User List in Auth class
        const users = Auth.getUsers();
        const index = users.findIndex((u) => u.studentId === user.studentId);
        if (index !== -1) {
          users[index] = { ...users[index], firstName: fname, lastName: lname };
          if (pass) users[index].password = pass;

          localStorage.setItem(Auth.USERS_KEY, JSON.stringify(users));
          localStorage.setItem(
            Auth.CURRENT_USER_KEY,
            JSON.stringify(users[index])
          ); // Update session

          // Refresh
          user = Auth.getCurrentUser(); // Reload from storage
          renderProfile();
          showToast("Profile updated!", "success");

          bootstrap.Modal.getInstance(
            document.getElementById("editProfileModal")
          ).hide();
        }
      }

      renderProfile();
    </script>
  </body>
</html>
