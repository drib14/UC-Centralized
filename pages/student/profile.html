<html lang="en">
  <head>
    <link

      href="/assets/uc-central-logo.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <title>UC-Central</title>
    <link

    />
    <link

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html"
          ><i class="fa-solid fa-school me-2"></i>UC-Central</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="events.html">Events</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="merch.html">Merch Store</a>
            </li>
          </ul>
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item me-3">
              <a class="nav-link position-relative" href="cart.html">
                <i class="fa-solid fa-cart-shopping fa-lg"></i>
                <span
                  id="cart-badge"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"

            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle active"
                href="#"
                id="userDropdown"

              >
                <span id="nav-user-name">Student</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="profile.html">Profile</a>
                </li>
                <li>
                  <a class="dropdown-item text-danger" href="#" id="logout-btn"

          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-header bg-success text-white">
              <h4 class="mb-0">
                <i class="fa-solid fa-user me-2"></i>My Profile
              </h4>
            </div>
            <div class="card-body text-center py-4">
              <img
                src=""
                id="profile-img-display"
                class="rounded-circle mb-3 border border-4 border-success"
                width="120"
                height="120"
                style="object-fit: cover; display: none;"
              />
              <h3 id="p-name" class="fw-bold">Student Name</h3>
              <p id="p-id" class="text-muted mb-4">ID: 12345678</p>

              <div class="row text-start g-3 justify-content-center">
                <div class="col-md-8">
                  <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                      <strong>Department:</strong>
                      <span id="p-dept" class="float-end">BSIT</span>
                    </li>
                    <li class="list-group-item">
                      <strong>Program:</strong>
                      <span id="p-prog" class="float-end">IT</span>
                    </li>
                    <li class="list-group-item">
                      <strong>Year Level:</strong>
                      <span id="p-year" class="float-end">3</span>
                    </li>
                    <li class="list-group-item">
                      <strong>Role:</strong>
                      <span
                        id="p-role"
                        class="float-end text-uppercase badge bg-secondary"
                        >Student</span
                      >
                    </li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="card-footer text-center">
              <button
                class="btn btn-outline-secondary btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#editProfileModal"
              >
                Edit Profile
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">Edit Profile</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="edit-profile-form">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">First Name</label>
                  <input
                    type="text"
                    id="e-fname"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Last Name</label>
                  <input
                    type="text"
                    id="e-lname"
                    class="form-control"
                    required
                  />
                </div>
              </div>
              <!-- Disabled fields -->
              <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" id="e-id" class="form-control" disabled />
              </div>
              <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" id="e-dept" class="form-control" disabled />
              </div>
              <hr />
              <div class="mb-3">
                <label class="form-label">New Password (Optional)</label>
                <input
                  type="password"
                  id="e-pass"
                  class="form-control"
                  placeholder="Leave blank to keep current"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="saveProfile()"
            >
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      id="toast-container"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
      Auth.checkSession();
      let user = Auth.getCurrentUser();
      const profileImgEl = document.getElementById('profile-img-display');

      function renderProfile() {
        if (user) {
          document.getElementById(
            "p-name"
          ).textContent = `${user.firstName} ${user.lastName}`;
          document.getElementById("p-id").textContent = `ID: ${user.studentId}`;
          document.getElementById("p-dept").textContent = user.department || 'N/A';
          document.getElementById("p-prog").textContent = user.program || 'N/A';
          document.getElementById("p-year").textContent = user.year || 'N/A';
          document.getElementById("p-role").textContent = user.role;

          // Initials Logic
          if (user.profileImage) {
              profileImgEl.src = user.profileImage;
              profileImgEl.style.display = 'inline-block';
              const ph = document.getElementById('profile-placeholder');
              if (ph) ph.style.display = 'none';
          } else {
              profileImgEl.style.display = 'none';
              const fInitial = user.firstName ? user.firstName.charAt(0) : '';
              const lInitial = user.lastName ? user.lastName.charAt(0) : '';
              const initials = (fInitial + lInitial).toUpperCase();

              let placeholder = document.getElementById('profile-placeholder');
              if (!placeholder) {
                  placeholder = document.createElement('div');
                  placeholder.id = 'profile-placeholder';
                  placeholder.className = 'rounded-circle mb-3 border border-4 border-success d-flex align-items-center justify-content-center bg-light text-success fw-bold mx-auto';
                  placeholder.style.width = '120px';
                  placeholder.style.height = '120px';
                  placeholder.style.fontSize = '40px';
                  profileImgEl.parentNode.insertBefore(placeholder, profileImgEl);
              }
              placeholder.textContent = initials;
              placeholder.style.display = 'flex';
          }

          // Pre-fill Edit Form
          document.getElementById("e-fname").value = user.firstName;
          document.getElementById("e-lname").value = user.lastName;
          document.getElementById("e-id").value = user.studentId;
          document.getElementById("e-dept").value = user.department || '';
        }
      }

      async function saveProfile() {
        const fname = document.getElementById("e-fname").value;
        const lname = document.getElementById("e-lname").value;
        const pass = document.getElementById("e-pass").value;

        if (!fname || !lname) {
          showToast("Name is required", "error");
          return;
        }

        const updateData = {
            firstName: fname,
            lastName: lname
        };
        if (pass) updateData.password = pass;

        try {
            const updatedUser = await API.updateProfile(updateData);

            // Update local session
            // API returns user object (without token)
            // We need to keep the token
            const currentSession = JSON.parse(localStorage.getItem(Auth.CURRENT_USER_KEY));
            const newToken = localStorage.getItem(Auth.TOKEN_KEY); // Token doesn't change

            // Update Auth class keys if they differ?
            // Auth.js uses CURRENT_USER_KEY for user object.
            localStorage.setItem(Auth.CURRENT_USER_KEY, JSON.stringify(updatedUser));

            user = updatedUser;
            renderProfile();
            showToast("Profile updated!", "success");

            bootstrap.Modal.getInstance(
                document.getElementById("editProfileModal")
            ).hide();
        } catch (e) {
            showToast(e.message, "error");
        }
      }

      renderProfile();
    </script>
  </body>
</html>
