                    <li class="nav-item">
                        <a class="nav-link" href="events.html">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="merch.html">Merch Store</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center">
                     <li class="nav-item me-3">
                        <a class="nav-link active position-relative" href="notifications.html">

                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link position-relative" href="cart.html">

    <div class="container py-4">
        <h2 class="mb-4 text-success"><i class="fa-solid fa-bell me-2"></i>Notifications</h2>

        <div class="list-group" id="notif-list">
            <!-- Populated via JS -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        Auth.requireLogin();

        const list = document.getElementById('notif-list');

        window.MockData.notifications.forEach(notif => {
            const item = document.createElement('a');
            item.href = "#";
            item.className = `list-group-item list-group-item-action ${notif.read ? '' : 'bg-light fw-bold'}`;
            item.innerHTML = `
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1">${notif.title}</h5>
                    <small class="${notif.read ? 'text-muted' : 'text-primary'}">${notif.time}</small>
                </div>
                <p class="mb-1">${notif.message}</p>
            `;
            list.appendChild(item);
        });
    </script>
